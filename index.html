  /* ── Works ── */
  /* 매체 표시 이름 */
  const CAT_LABEL = {
    painting: 'Painting', installation: 'Installation', collage: 'Collage', photography: 'Photography', community: 'Community · Public Art',
    video: 'Video', photography: 'Photography',
    performance: 'Performance', printmaking: 'Printmaking', sculpture: 'Sculpture'
  };
  function catLabel(c) { return CAT_LABEL[c] || (c ? c.charAt(0).toUpperCase()+c.slice(1) : 'Other'); }

  let _activeFilter = 'all';

  function renderWorks() {
    const grid = document.getElementById('galleryGrid');
    const filterBar = document.getElementById('galleryFilter');
    grid.innerHTML = '';

    const works = [...(C.works || [])].sort((a, b) => yearNum(b) - yearNum(a));
    if (!works.length) { grid.innerHTML = '<p class="gallery-empty">No works registered.</p>'; return; }

    // 고정 메뉴 4개: Installation / Video / Drawing / Painting
    const MENU = [
      { key: 'all',          label: 'All' },
      { key: 'installation', label: 'Installation' },
      { key: 'video',        label: 'Video' },
      { key: 'photography',  label: 'Photography' },
      { key: 'community',    label: 'Community · Public Art' },
      { key: 'painting',     label: 'Painting' },
      { key: 'collage',      label: 'Collage' },
    ];
    filterBar.innerHTML = '';
    MENU.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (_activeFilter === m.key ? ' active' : '');
      btn.dataset.filter = m.key;
      btn.textContent = m.label;
      filterBar.appendChild(btn);
    });
    wireFilter();

    // 카테고리 표시 순서 (그 외는 뒤로)
    const CAT_ORDER = ['installation','video','collage','photography','community','painting'];
    function catRank(c){ const i = CAT_ORDER.indexOf(c); return i === -1 ? CAT_ORDER.length : i; }

    function buildItem(w, i) {
      const item = document.createElement('div');
      const thumbRaw = getThumb(w);
      const thumbSrc = thumbRaw ? (isYT(thumbRaw) ? ytThumb(thumbRaw) : thumbRaw) : '';
      const hasVideo = getImages(w).some(isYT) || w.category === 'video';
      const n = getImages(w).length;
      item.className = 'gallery-item' + (thumbSrc ? '' : ' ph-' + ((i % 6) + 1));
      item.dataset.cat = w.category || '';
      item.innerHTML =
        '<div class="g-frame">' +
        (thumbSrc ? `<img class="g-img" src="${esc(thumbSrc)}" alt="${esc(t(w,'title'))}" loading="lazy">` : '') +
        `<span class="g-view">View${n > 1 ? ' · ' + n : ''}</span></div>` +
        `<div class="g-meta">
           <span class="g-title">${esc(t(w,'title'))}</span>
           <span class="g-year">${hasVideo ? '<span class="g-vid">Video</span>' : ''}${esc(w.year || '')}</span>
         </div>` +
        (t(w,'desc') ? `<p class="g-desc">${esc(t(w,'desc'))}</p>` : '');
      item.addEventListener('click', () => openModal(w));
      wireFrame(item, w, true);
      return item;
    }

    function buildFeatured(w) {
      const item = document.createElement('article');
      item.className = 'featured-item reveal';
      const imgs = getImages(w);
      const vIdx = imgs.findIndex(isYT);                 // 첫 번째 영상 위치
      const hasVideo = vIdx !== -1;
      const still = firstStill(w) || (hasVideo ? ytThumb(imgs[vIdx]) : getThumb(w));
      const n = imgs.length;
      const moreKo = hasVideo ? '영상 · 이미지 ' + n + '점 보기' : '이미지 ' + n + '점 보기';
      const moreEn = hasVideo ? 'View video & ' + n + ' images' : 'View ' + n + ' images';
      item.innerHTML =
        '<div class="g-frame">' +
        (still ? `<img class="g-img" src="${esc(still)}" alt="${esc(t(w,'title'))}" loading="lazy">` : '') +
        (hasVideo ? `<button type="button" class="yt-play-icon f-video-btn" data-go="video">Play video</button>` : '') +
        '</div>' +
        `<div class="featured-meta">
           <h3 class="featured-title">${esc(t(w,'title'))}<span class="f-year">${esc(catLabel(w.category))} · ${esc(w.year || '')}</span></h3>
           <div>
             ${t(w,'desc') ? `<p class="featured-desc">${esc(t(w,'desc'))}</p>` : ''}
             <span class="featured-more">${esc(lang === 'en' ? moreEn : moreKo)} →</span>
           </div>
         </div>`;
      /* 모서리의 Play video → 영상부터 / 그 밖의 곳 → 첫 이미지부터 */
      item.addEventListener('click', e => {
        const toVideo = hasVideo && e.target.closest('[data-go="video"]');
        const firstImg = Math.max(0, imgs.findIndex(u => u && !isYT(u)));
        openModal(w, toVideo ? vIdx : firstImg);
      });
      wireFrame(item, w, false);
      return item;
    }

    /* 대표작 (전체 보기일 때만, Works 맨 위) */
    if (_activeFilter === 'all') {
      const list = [];
      (OPT.featured || []).forEach(q => {
        let w = findWork(q);
        if (!w || list.indexOf(w) !== -1) return;
        /* 설정에 video 주소를 적으면 그 영상을 대표작 재생 영상으로 사용 */
        if (q.video && isYT(q.video)) {
          const rest = getImages(w).filter(u => u !== q.video);
          w = Object.assign({}, w, { images_full: [q.video].concat(rest) });
        }
        list.push(w);
      });
      works.forEach(w => { if (w.featured === true && list.indexOf(w) === -1) list.push(w); });
      if (list.length) {
        const sec = document.createElement('div');
        sec.className = 'featured';
        const h = document.createElement('h3');
        h.className = 'gallery-group-h reveal';
        h.innerHTML = `${lang === 'en' ? 'Selected Works' : 'Selected Works · 대표작'}<span class="g-count">${list.length}</span>`;
        sec.appendChild(h);
        list.forEach(w => sec.appendChild(buildFeatured(w)));
        grid.appendChild(sec);
      }
    }

    // 매체별로 묶어서 섹션 렌더 (전체면 모든 그룹, 필터 시 해당 그룹만)
    const groups = {};
    works.forEach(w => {
      const c = w.category || 'other';
      (groups[c] = groups[c] || []).push(w);
    });
    const cats = Object.keys(groups).sort((a, b) => {
      const r = catRank(a) - catRank(b);
      return r !== 0 ? r : a.localeCompare(b);
    });

    let idx = 0;
    cats.forEach(c => {
      if (_activeFilter !== 'all' && c !== _activeFilter) return;
      const sec = document.createElement('div');
      sec.className = 'gallery-group reveal';
      const h = document.createElement('h3');
      h.className = 'gallery-group-h';
      h.innerHTML = `${esc(catLabel(c))}<span class="g-count">${groups[c].length}</span>`;
      const inner = document.createElement('div');
      inner.className = 'gallery-grid-inner';
      groups[c].forEach(w => { inner.appendChild(buildItem(w, idx++)); });
      sec.appendChild(h);
      sec.appendChild(inner);
      grid.appendChild(sec);
    });
    if (typeof wireReveal === 'function') wireReveal();
  }

  /* ── 썸네일 움직임 ──
     · 설정에 짧은 반복 영상(clips)이 있으면 마우스를 올릴 때 재생
     · 없고 이미지가 여러 장이면 다른 컷이 천천히 겹쳐 바뀜
     · 터치 화면에서는 화면 가운데에 올 때 자동으로 같은 효과 */
  const CAN_HOVER = !!(window.matchMedia && matchMedia('(hover: hover)').matches);
  const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let _touchIO = null;
  function clipFor(w) {
    const m = OPT.clips || {};
    return w.clip || m[w.title] || m[(w.title || '').trim()] || m[w.titleEn] || '';
  }
  function wireFrame(item, w, isGrid) {
    const frame = item.querySelector('.g-frame');
    const img = item.querySelector('img.g-img');
    if (img) {
      const done = () => frame.classList.add('is-loaded');
      if (img.complete && img.naturalWidth) done(); else img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
    }
    if (REDUCED) return;

    const clip = clipFor(w);
    const stills = getImages(w).filter(u => u && !isYT(u));
    const first = img ? img.getAttribute('src') : '';
    const others = stills.filter(u => u !== first).slice(0, 5);
    if (!clip && !others.length) return;

    let timer = null, video = null, layers = [], k = -1;
    function start() {
      if (clip) {
        if (!video) {
          video = document.createElement('video');
          video.className = 'g-clip'; video.src = clip;
          video.muted = true; video.loop = true; video.playsInline = true;
          video.setAttribute('playsinline', ''); video.preload = 'none';
          video.addEventListener('playing', () => video.classList.add('show'));
          frame.appendChild(video);
        }
        const p = video.play(); if (p && p.catch) p.catch(() => {});
        return;
      }
      preload();
      if (timer) return;
      /* 다 불러온 컷만 보여줌 — 아직 로딩 중인 컷은 건너뛰어 흰 화면이 번쩍이지 않게 */
      const ready = l => l.complete && l.naturalWidth > 0;
      const step = () => {
        const ok = layers.filter(ready);
        if (!ok.length) return;                  // 아직 준비된 컷이 없으면 원래 이미지 유지
        k = (k + 1) % (ok.length + 1);           // 마지막 단계는 원래 대표 이미지
        layers.forEach(l => l.classList.toggle('show', l === ok[k]));
      };
      /* 첫 전환은 준비된 컷이 있을 때 바로, 아니면 첫 컷이 로드되는 즉시 */
      if (layers.some(ready)) step();
      else layers.forEach(l => l.addEventListener('load', () => { if (timer && k === -1) step(); }, { once: true }));
      timer = setInterval(step, isGrid ? 1300 : 2200);
    }
    function stop() {
      if (video) { video.pause(); video.classList.remove('show'); }
      if (timer) { clearInterval(timer); timer = null; }
      layers.forEach(l => l.classList.remove('show')); k = -1;
    }
    /* 화면에 들어오면 다른 컷을 미리 조용히 받아둠 (마우스를 올리는 순간 바로 나오도록) */
    function preload() {
      if (clip || layers.length) return;
      layers = others.map(u => {
        const im = document.createElement('img');
        im.className = 'g-cycle'; im.src = u; im.alt = ''; im.decoding = 'async';
        frame.insertBefore(im, frame.querySelector('.yt-play-icon, .g-view'));
        return im;
      });
    }
    if (CAN_HOVER && 'IntersectionObserver' in window) {
      const pio = new IntersectionObserver(es => {
        if (es.some(e => e.isIntersecting)) { pio.disconnect(); setTimeout(preload, 600); }
      }, { rootMargin: '0px 0px 200px 0px' });
      pio.observe(frame);
    }
    if (CAN_HOVER) {
      frame.addEventListener('mouseenter', start);
      frame.addEventListener('mouseleave', stop);
    } else if ('IntersectionObserver' in window) {
      if (!_touchIO) {
        _touchIO = new IntersectionObserver(es => es.forEach(e => {
          const f = e.target.__motion; if (!f) return;
          e.isIntersecting ? f.start() : f.stop();
        }), { rootMargin: '-35% 0px -35% 0px' });
      }
      frame.__motion = { start, stop };
      _touchIO.observe(frame);
    }
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  /* ── Papers (논문) ──
     데이터 항목 (SITE_CONTENT.papers):
       year, title / titleEn, subtitle / subtitleEn, journal / journalEn,
       keywords / keywordsEn (배열), abstract / abstractEn,
       pdf  : 'papers/파일이름.pdf' 처럼 사이트에 올린 PDF 경로 (누르면 바로 다운로드)
       pdfSize : 버튼 옆에 보일 파일 크기 (예: '13MB', 선택)
       url  : KCI·RISS·DOI 등 원문 페이지 주소
     논문이 하나도 없으면 섹션·메뉴가 숨겨지고 번호가 자동으로 당겨집니다. */
  function renderPapers() {
    const list = document.getElementById('paperList');
    if (!list) return;
    const papers = [...(C.papers || [])].sort((a, b) => yearNum(b) - yearNum(a));
    const has = papers.length > 0;
    const sec = document.getElementById('papers');
    sec.style.display = has ? '' : 'none';
    const rule = document.getElementById('papersRule');
    if (rule) rule.style.display = has ? '' : 'none';
    document.querySelectorAll('.nav-papers').forEach(n => n.style.display = has ? '' : 'none');
    document.querySelectorAll('[data-n="cv"]').forEach(n => n.textContent = has ? '03' : '02');
    document.querySelectorAll('[data-n="exhibitions"]').forEach(n => n.textContent = has ? '04' : '03');
    document.querySelectorAll('[data-n="contact"]').forEach(n => n.textContent = has ? '05' : '04');
    if (!has) { list.innerHTML = ''; return; }

    const isEn = lang === 'en';
    const L = isEn
      ? { abs: 'Read full abstract', hide: 'Show less', pdf: 'Download PDF', link: 'View source' }
      : { abs: '초록 전체 보기', hide: '접기', pdf: 'PDF 다운로드', link: '원문 보기' };
    _papersSorted = papers;
    list.innerHTML = papers.map((p, i) => {
      const kw = (isEn && p.keywordsEn && p.keywordsEn.length) ? p.keywordsEn : (p.keywords || []);
      const abs = t(p, 'abstract');
      const sub = t(p, 'subtitle');
      return `
        <article class="paper-item reveal">
          <div class="paper-year">${esc(p.year || '')}</div>
          <div class="paper-info">
            <h3 class="paper-title">${esc(t(p, 'title'))}</h3>
            ${sub ? `<div class="paper-sub">${esc(sub)}</div>` : ''}
            ${t(p, 'journal') ? `<div class="paper-venue">${esc(t(p, 'journal'))}</div>` : ''}
            ${kw.length ? `<div class="paper-kw">${kw.map(k => `<span>${esc(k)}</span>`).join('')}</div>` : ''}
            ${abs ? `<p class="paper-abs" id="pabs${i}">${nl2br(abs)}</p>` : ''}
            ${(abs || p.pdf || p.url) ? `<div class="paper-actions">
              ${abs ? `<button type="button" class="paper-link" data-abs="${i}" aria-expanded="false" aria-controls="pabs${i}">${L.abs}</button>` : ''}
              ${p.pdf ? `<a class="paper-link" href="${esc(p.pdf)}" download="${esc(p.pdf.split('/').pop())}">${L.pdf} ↓${p.pdfSize ? ` <span style="color:var(--ink-soft);letter-spacing:0.06em">${esc(p.pdfSize)}</span>` : ''}</a>` : ''}
              ${p.url ? `<a class="paper-link" href="${esc(p.url)}" target="_blank" rel="noopener">${L.link} ↗</a>` : ''}
            </div>` : ''}
            ${relWorks(p).length ? `<div class="paper-works">
              <div class="paper-works-h">${isEn ? 'Works discussed in this text' : '이 글에서 다룬 작업'}</div>
              <div class="paper-works-grid">${relWorks(p).map((w, j) => {
                const th = getThumb(w); const src = th ? (isYT(th) ? ytThumb(th) : th) : '';
                return `<button type="button" class="pw-item" data-p="${i}" data-w="${j}">
                  <div class="pw-frame">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : ''}</div>
                  <div class="pw-title">${esc(String(t(w, 'title')).replace(/\s+/g, ' ').trim())}${w.year ? ', ' + esc(String(w.year).trim()) : ''}${relWorks(p).filter(x => x.title.trim() === w.title.trim()).length > 1 ? ' · ' + esc(catLabel(w.category)) : ''}</div>
                </button>`; }).join('')}</div>
            </div>` : ''}
          </div>
        </article>`;
    }).join('');
    /* 초록은 3줄까지만 보이고, 넘치는 경우에만 '초록 전체 보기' 버튼이 생김
       (버튼이나 초록 글자를 누르면 펼쳐지고 다시 누르면 접힘) */
    list.querySelectorAll('[data-abs]').forEach(b => {
      const item = b.closest('.paper-item');
      const absEl = item.querySelector('.paper-abs');
      const toggle = () => {
        const open = item.classList.toggle('open');
        b.setAttribute('aria-expanded', open);
        b.textContent = open ? L.hide : L.abs;
      };
      const check = () => {
        if (item.classList.contains('open')) return;
        const long = absEl.scrollHeight > absEl.clientHeight + 2;
        b.style.display = long ? '' : 'none';
        absEl.classList.toggle('is-long', long);
      };
      b.addEventListener('click', toggle);
      absEl.addEventListener('click', () => { if (absEl.classList.contains('is-long')) toggle(); });
      requestAnimationFrame(check);
      window.addEventListener('resize', check);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(check);
    });
    list.querySelectorAll('.pw-item').forEach(b => b.addEventListener('click', () => {
      const w = relWorks(papers[+b.dataset.p])[+b.dataset.w];
      if (w) openModal(w);
    }));
    if (typeof wireReveal === 'function') wireReveal();
  }

  /* 논문 ↔ 작품 연결 : 논문 데이터의 works 목록({title, year, category})으로 작품을 찾음 */
  let _papersSorted = [];
  function relWorks(p) { return (p.works || []).map(findWork).filter(Boolean); }
  function papersFor(w) { return _papersSorted.filter(p => relWorks(p).indexOf(w) !== -1); }
  function goToPaper(p) {
    closeModal();
    const i = _papersSorted.indexOf(p);
    const item = document.querySelectorAll('#paperList .paper-item')[i];
    if (!item) return;
    item.classList.add('in');
    if (window.__goToSection) window.__goToSection(item); else item.scrollIntoView({ behavior: 'smooth', block: 'start' });
    item.classList.remove('flash'); void item.offsetWidth; item.classList.add('flash');
  }

  /* ── Exhibitions ── */
  const STATUS_LABEL = {
    ko: { current:'진행 중', upcoming:'예정', past:'종료' },
    en: { current:'Current', upcoming:'Upcoming', past:'Past' }
  };
  const STATUS_ORDER = { current: 0, upcoming: 1, past: 2 };
  function renderExhibitions() {
    const list = document.getElementById('exhibitionList');
    list.innerHTML = '';
    const items = [...(C.exhibitions || [])].sort((a, b) =>
      (STATUS_ORDER[a.status || 'past'] ?? 3) - (STATUS_ORDER[b.status || 'past'] ?? 3));
    items.forEach(ex => {
      const st  = ex.status || 'past';
      const lbl = (STATUS_LABEL[lang] || STATUS_LABEL.ko)[st] || st;
      list.innerHTML += `
        <div class="exhibition-item reveal${st === 'current' ? ' is-current' : ''}">
          <div class="ex-date">${nl2br(ex.date)}</div>
          <div class="ex-info">
            <div class="ex-title">${esc(t(ex,'title'))}</div>
            <div class="ex-venue">${esc(t(ex,'venue'))}</div>
            ${t(ex,'location') ? `<div class="ex-location">${esc(t(ex,'location'))}</div>` : ''}
          </div>
          <span class="ex-badge ${esc(st)}">${esc(lbl)}</span>
        </div>`;
    });
  }

  /* ── Modal ── */
  const modal = document.getElementById('modal');
  let _modalWork = null;
  let _modalIdx = 0;

  /* ── YouTube 유틸 ── */
  function ytId(url) {
    if (!url || !url.includes('youtu')) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function isYT(src) { return !!ytId(src); }
  function ytThumb(src) { return `https://img.youtube.com/vi/${ytId(src)}/hqdefault.jpg`; }
  function ytEmbed(src) { return `https://www.youtube.com/embed/${ytId(src)}?autoplay=1&rel=0`; }

  function getImages(w) {
    // 모달용: full 이미지 우선
    if (w.images_full && w.images_full.length) return w.images_full;
    if (w.images && w.images.length) return w.images;
    if (w.image) return [w.image];
    return [];
  }
  function getThumb(w) {
    // 갤러리 썸네일용: thumb 우선
    const src = (w.images_thumb && w.images_thumb[0])
             || (w.images && w.images[0])
             || w.image || '';
    return src;
  }

  function showModalImage(w, idx) {
    _modalWork = w;
    _modalIdx = idx;
    const imgs = getImages(w);
    const content = document.getElementById('modalContent');
    const dots = document.getElementById('modalDots');
    const prev = document.getElementById('modalPrev');
    const next = document.getElementById('modalNext');

    // 이미지 or 유튜브 표시
    if (imgs.length > 0 && imgs[idx]) {
      const src = imgs[idx];
      if (isYT(src)) {
        content.innerHTML = `<div class="modal-video-wrap"><iframe src="${ytEmbed(src)}" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
      } else {
        content.innerHTML = `<img class="modal-img" src="${esc(src)}" alt="${esc(w.title)}">`;
      }
    } else {
      content.innerHTML = `<div class="modal-ph">IMAGE</div>`;
    }

    // 화살표
    prev.classList.toggle('hidden', imgs.length <= 1 || idx === 0);
    next.classList.toggle('hidden', imgs.length <= 1 || idx >= imgs.length - 1);

    // 닷 인디케이터
    dots.innerHTML = '';
    if (imgs.length > 1) {
      imgs.forEach((_, i) => {
        const d = document.createElement('span');
        d.className = 'modal-dot' + (i === idx ? ' active' : '');
        d.onclick = () => showModalImage(w, i);
        dots.appendChild(d);
      });
    }

    // 캡션
    let cap = [t(w,'title'), w.year].filter(Boolean).join(', ');
    if (t(w,'desc')) cap += '  ·  ' + t(w,'desc');
    if (imgs.length > 1) cap += `  (${idx+1}/${imgs.length})`;
    document.getElementById('modalCaption').textContent = cap;

    const rel = document.getElementById('modalRelated');
    rel.innerHTML = '';
    papersFor(w).forEach(p => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = (lang === 'en' ? 'Related text: ' : '관련 글: ') + t(p, 'title') + ' →';
      b.addEventListener('click', e => { e.stopPropagation(); goToPaper(p); });
      rel.appendChild(b);
    });
  }

  function openModal(w, start) {
    const n = getImages(w).length;
    showModalImage(w, Math.min(Math.max(0, start || 0), Math.max(0, n - 1)));
    modal.classList.add('open');
  }

  document.getElementById('modalPrev').addEventListener('click', (e) => {
    e.stopPropagation();
    if (_modalWork && _modalIdx > 0) showModalImage(_modalWork, _modalIdx - 1);
  });
  document.getElementById('modalNext').addEventListener('click', (e) => {
    e.stopPropagation();
    if (_modalWork) {
      const imgs = getImages(_modalWork);
      if (_modalIdx < imgs.length - 1) showModalImage(_modalWork, _modalIdx + 1);
    }
  });
  function closeModal() {
    modal.classList.remove('open');
    // iframe autoplay 정지
    const iframe = modal.querySelector('iframe');
    if (iframe) iframe.src = iframe.src;
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft' && _modalWork && _modalIdx > 0) showModalImage(_modalWork, _modalIdx - 1);
    if (e.key === 'ArrowRight' && _modalWork) {
      const imgs = getImages(_modalWork);
      if (_modalIdx < imgs.length - 1) showModalImage(_modalWork, _modalIdx + 1);
    }
  });

  /* ── Gallery Filter ── */
  function wireFilter() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        _activeFilter = btn.dataset.filter;
        renderWorks();
      });
    });
  }

  /* ── Contact Form ──────────────────────────────────────────────
     페이지를 떠나지 않고 문의 메일이 바로 전송됩니다.
     기본값은 formsubmit.co (가입 불필요, 무료).
       · 첫 문의가 들어오면 formsubmit 이 작가 메일로 '확인' 메일을 한 번 보냅니다.
         그 안의 버튼을 누르면 그때부터 모든 문의가 바로 메일함에 도착합니다.
       · 다른 서비스로 바꾸려면 아래 주소만 교체하세요.
         예) const FORM_ENDPOINT = 'https://formspree.io/f/abcdwxyz';
       · 빈 문자열('')로 두면 방문자의 메일 앱을 여는 방식으로 돌아갑니다.
     ────────────────────────────────────────────────────────────── */
  const CONTACT_EMAIL = (C.artist && C.artist.email) || '';
  const FORM_ENDPOINT = CONTACT_EMAIL ? ('https://formsubmit.co/ajax/' + CONTACT_EMAIL) : '';

  const FORM_MSG = {
    ko: {
      empty:    '이름, 이메일, 메시지를 모두 입력해 주세요.',
      badEmail: '이메일 주소를 다시 확인해 주세요.',
      sending:  '보내는 중…',
      ok:       '보내주셔서 감사합니다. 확인 후 답장 드리겠습니다.',
      fail:     '전송에 실패했습니다. {email} 으로 보내주세요.',
      okTitle:      '전송되었습니다',
      failTitle:    '전송하지 못했습니다',
      pendingTitle: '문의가 접수되었습니다',
      pending:      '메시지가 정상적으로 접수되었습니다. 작가가 확인하는 대로 답장 드리겠습니다.',
      mailTitle: '아래 방법으로 보내주세요',
      mail:      '메일 내용이 준비되었습니다. 아래에서 편한 방법을 골라주세요. 주소는 {email} 입니다.'
    },
    en: {
      empty:    'Please fill in your name, email and message.',
      badEmail: 'Please check your email address.',
      sending:  'Sending…',
      ok:       'Thank you — I will get back to you soon.',
      fail:     'Sending failed. Please write to {email} instead.',
      okTitle:      'Message sent',
      failTitle:    'Could not send',
      pendingTitle: 'Message received',
      pending:      'Your message has been received. The artist will get back to you soon.',
      mailTitle: 'Choose how to send',
      mail:      'Your message is ready. Pick one of the options below — the address is {email}.'
    }
  };

  function formSay(kind, text) {
    const el = document.getElementById('formStatus');
    if (!el) return;
    el.textContent = text;
    el.className = 'form-status' + (kind ? ' ' + kind : '');
  }

  /* 전송 완료 팝업 (actions: [{label, run}] — 전송 실패 시 대안 버튼) */
  function showSentPopup(title, text, actions) {
    const bg = document.getElementById('sentPopup');
    if (!bg) { alert(title + '\n\n' + text); return; }
    document.getElementById('sentTitle').textContent = title;
    document.getElementById('sentText').textContent  = text;
    const box = document.getElementById('sentActions');
    if (box) {
      box.innerHTML = '';
      (actions || []).forEach(a => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'sent-action';
        el.textContent = a.label;
        el.addEventListener('click', () => a.run(el));
        box.appendChild(el);
      });
    }
    const btn = document.getElementById('sentClose');
    btn.textContent = (lang === 'en') ? 'Close' : '확인';
    bg.classList.add('open');
    btn.focus({ preventScroll: true });
  }
  function hideSentPopup() {
    const bg = document.getElementById('sentPopup');
    if (bg) bg.classList.remove('open');
  }
  (function wireSentPopup() {
    const bg = document.getElementById('sentPopup');
    if (!bg) return;
    document.getElementById('sentClose').addEventListener('click', hideSentPopup);
    bg.addEventListener('click', e => { if (e.target === bg) hideSentPopup(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && bg.classList.contains('open')) hideSentPopup();
    });
  })();

  function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const M  = FORM_MSG[lang] || FORM_MSG.ko;
    const to = (C.artist && C.artist.email) || '';

    const name  = (form.querySelector('#inputName')  || {}).value || '';
    const email = (form.querySelector('#inputEmail') || {}).value || '';
    const msg   = (form.querySelector('#inputMsg')   || {}).value || '';
    const n = name.trim(), em = email.trim(), ms = msg.trim();

    if (!n || !em || !ms) { formSay('err', M.empty); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { formSay('err', M.badEmail); return; }

    const btn  = form.querySelector('.btn-submit');
    const site = location.hostname || (C.artist && (C.artist.nameEn || C.artist.nameKo)) || 'website';
    const subject = '[' + site + '] ' + n + (lang === 'en' ? ' — inquiry' : ' 님의 문의');
    const bodyText = ms + '\n\n---\n' + n + ' <' + em + '>';

    /* 메일 앱 / Gmail / 복사 — 전송이 막혔을 때의 대안 */
    function fallbackActions() {
      const mailHref = 'mailto:' + to
        + '?subject=' + encodeURIComponent(subject)
        + '&body='    + encodeURIComponent(bodyText);
      const gmailHref = 'https://mail.google.com/mail/?view=cm&fs=1'
        + '&to='   + encodeURIComponent(to)
        + '&su='   + encodeURIComponent(subject)
        + '&body=' + encodeURIComponent(bodyText);
      const isEn = lang === 'en';
      return [
        { label: isEn ? 'Open Gmail' : 'Gmail로 보내기',
          run: () => window.open(gmailHref, '_blank', 'noopener') },
        { label: isEn ? 'Mail app' : '메일 앱으로 열기',
          run: () => { window.location.href = mailHref; } },
        { label: isEn ? 'Copy message' : '내용 복사',
          run: (el) => {
            const txt = to + '\n' + subject + '\n\n' + bodyText;
            const done = () => { el.textContent = isEn ? 'Copied ✓' : '복사됨 ✓'; };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(txt).then(done).catch(() => {});
            } else {
              const ta = document.createElement('textarea');
              ta.value = txt; document.body.appendChild(ta); ta.select();
              try { document.execCommand('copy'); done(); } catch (e) {}
              document.body.removeChild(ta);
            }
          } }
      ];
    }

    /* 1) 기본 : 페이지를 떠나지 않고 바로 전송 */
    if (FORM_ENDPOINT) {
      btn.disabled = true;
      formSay('', M.sending);

      const isFormSubmit = FORM_ENDPOINT.indexOf('formsubmit.co') !== -1;
      const opts = isFormSubmit
        ? { method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              name: n, email: em, message: ms,
              _subject: subject,
              _template: 'table',
              _captcha: 'false'
            }) }
        : { method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(form) };

      fetch(FORM_ENDPOINT, opts)
        .then(res => res.json().catch(() => ({})).then(j => ({ res: res, json: j })))
        .then(({ res, json }) => {
          const note = String(json.message || '');
          /* 아직 활성화 전(첫 전송) : 작가 메일함의 확인 메일을 눌러야 한다.
             방문자에게는 실패가 아니라 '접수됨'으로 안내한다. */
          if (/confirm|activat/i.test(note)) {
            formSay('ok', M.pending);
            form.reset();
            showSentPopup(M.pendingTitle, M.pending);
            console.info('[site] formsubmit: 확인 메일이 ' + to + ' 로 발송되었습니다. 링크를 눌러 활성화하세요.');
            return;
          }
          if (!res.ok || json.success === 'false' || json.success === false) {
            throw new Error(note || ('HTTP ' + res.status));
          }
          formSay('ok', M.ok);
          form.reset();
          showSentPopup(M.okTitle, M.ok);
        })
        .catch(err => {
          console.error('[site] form send failed:', err);
          formSay('err', M.fail.replace('{email}', to));
          showSentPopup(M.failTitle, M.fail.replace('{email}', to), fallbackActions());
        })
        .then(() => { btn.disabled = false; });
      return;
    }

    /* 2) 폼 서비스를 쓰지 않을 때 : 메일 앱 / Gmail / 복사 */
    formSay('ok', M.mail.replace('{email}', to));
    showSentPopup(M.mailTitle, M.mail.replace('{email}', to), fallbackActions());
  }

  /* ── Nav active scroll ── */
  function wireScroll() {
    const nav = document.getElementById('nav');
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-links a');
    const sideLinks = document.querySelectorAll('.side-nav a');
    const gate = document.getElementById('gate');
    const side = document.querySelector('.side-nav');
    function onScroll() {
      const onHero = !!gate && window.scrollY < gate.offsetHeight - 70;
      if (nav) {
        nav.classList.toggle('on-hero', onHero);
        nav.classList.toggle('scrolled', !onHero && window.scrollY > 12);
      }
      if (side) side.classList.toggle('on-hero', onHero);
      let current = '';
      sections.forEach(s => { if (window.scrollY >= s.offsetTop - 120) current = s.id; });
      navLinks.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + current));
      sideLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  /* ── 메뉴 이동 ──
     위쪽 작품 이미지가 이동 중에 늦게 로딩되거나(높이가 커짐) 모바일 주소창이 접히면
     목표 위치가 아래로 밀려 '덜 가서 이미지에서 멈추는' 문제가 생긴다.
     그래서 이동하는 동안 매 순간 목표 위치를 다시 재고, 도착한 뒤에도 잠시 위치를 보정한다.
     사용자가 직접 스크롤하면 보정을 즉시 멈춘다. */
  function wireAnchors() {
    let job = 0;
    const stop = () => { job++; };
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(ev =>
      window.addEventListener(ev, e => { if (!e.target.closest || !e.target.closest('a[href^="#"]')) stop(); }, { passive: true }));

    function targetY(el) {
      return Math.max(0, Math.min(
        el.getBoundingClientRect().top + window.scrollY - (parseFloat(getComputedStyle(el).scrollMarginTop) || 0),
        document.documentElement.scrollHeight - window.innerHeight));
    }
    function jump(y) { window.scrollTo({ top: y, behavior: 'instant' }); }

    function goTo(el) {
      const my = ++job;
      const reduced = REDUCED;
      const startY = window.scrollY;
      const dur = reduced ? 0 : Math.min(1100, 450 + Math.abs(targetY(el) - startY) / 12);
      const t0 = performance.now();
      const ease = x => 1 - Math.pow(1 - x, 3);
      let settleUntil = 0;
      (function frame(now) {
        if (my !== job) return;
        const k = dur ? Math.min(1, (now - t0) / dur) : 1;
        const goal = targetY(el);                       // 매 프레임 다시 계산
        if (k < 1) {
          jump(startY + (goal - startY) * ease(k));
          return requestAnimationFrame(frame);
        }
        if (!settleUntil) settleUntil = now + 2500;     // 도착 후 2.5초간 위치 유지
        if (Math.abs(window.scrollY - goal) > 1) jump(goal);
        if (now < settleUntil) requestAnimationFrame(frame);
      })(t0);
    }

    document.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey) return;
      const id = a.getAttribute('href').slice(1);
      const el = id && document.getElementById(id);
      if (!el) return;
      e.preventDefault();
      goTo(el);
      try { history.replaceState(null, '', '#' + id); } catch (err) {}
    });
    window.__goToSection = goTo;

    /* 주소에 #texts 같은 위치가 붙어 들어온 경우에도 정확히 맞춤 */
    if (location.hash.length > 1) {
      const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) setTimeout(() => goTo(el), 50);
    }
  }

  /* ── Reveal on scroll ──
     어떤 이유로든 관찰이 실패해도 내용은 반드시 보이도록 안전장치를 둔다 */
  function showAllReveal() {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  }
  function wireReveal() {
    try {
      const els = document.querySelectorAll('.reveal:not(.in)');
      if (!('IntersectionObserver' in window)) { showAllReveal(); return; }
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
      els.forEach(el => io.observe(el));
      setTimeout(showAllReveal, 2500);   // 안전장치
    } catch (e) {
      showAllReveal();
    }
  }

  /* ── Init ── */
  /* 한 단계가 실패해도 나머지 화면은 그려지도록 각각 보호 */
  function run(fn, name) {
    try { fn(); } catch (e) { console.error('[site] ' + name + ' failed:', e); }
  }
  run(renderGate, 'gate');
  run(renderArtist, 'artist');
  run(renderWorks, 'works');
  run(renderCV, 'cv');
  run(renderPapers, 'papers');
  run(renderExhibitions, 'exhibitions');
  run(wireFilter, 'filter');
  run(wireScroll, 'scroll');
  run(wireAnchors, 'anchors');
  run(wireReveal, 'reveal');
</script>
</body>
</html>
