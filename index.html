<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="naver-site-verification" content="a78f21ebafd37b047b2a79e4f9a48257a4e76640" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Younghwan Choi (최영환) — Visual Artist based in Seoul, Korea. Works across painting, installation, and video." />
  <title>Younghwan Choi · 최영환</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500&family=Noto+Serif+KR:wght@200;300&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }
    :root {
      --ink: #1a1a18;
      --ink-soft: #6f6d67;
      --line: #ded9d1;
      --line-soft: #ebe7e0;
      --paper: #f6f4ef;
      --paper-2: #efece5;
      --white: #ffffff;
      /* 제목 계열은 명조 (Noto Serif KR), 본문은 고딕 */
      --serif: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
      --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-serif: var(--serif);
      --font-sans: var(--sans);
      --pad: 56px;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--ink); color: var(--paper); }
    img { max-width: 100%; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(246,244,239,0.88);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--pad);
      height: 64px;
      border-bottom: 1px solid transparent;
      transition: border-color .3s;
    }
    nav.scrolled { border-bottom-color: var(--line); }
    .nav-name {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--ink);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-links { display: flex; align-items: center; gap: 30px; list-style: none; }
    .nav-links a {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding-bottom: 3px;
      border-bottom: 1px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .nav-links a:hover, .nav-links a.on { color: var(--ink); border-bottom-color: var(--ink); }

    /* 언어 전환 */
    .nav-lang { display: flex; align-items: center; gap: 8px; margin-left: 6px; }
    .lang-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--sans);
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.14em;
      color: #b0aba2;
      padding: 3px 2px;
      transition: color .2s;
    }
    .lang-btn:hover { color: var(--ink); }
    .lang-btn.active { color: var(--ink); }
    .nav-lang .lang-btn + .lang-btn { border-left: 1px solid var(--line); padding-left: 10px; }

    /* ── Side Nav ── */
    .side-nav {
      position: fixed; right: 26px; top: 50%;
      transform: translateY(-50%);
      z-index: 90;
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 14px;
    }
    .side-nav a { display: flex; flex-direction: row-reverse; align-items: center; gap: 10px; }
    .side-nav .sn-num {
      font-size: 9px; letter-spacing: 0.14em;
      color: #b6b1a8;
      transition: color .25s;
    }
    .side-nav .sn-label {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0; transform: translateX(6px);
      transition: opacity .25s, transform .25s, color .25s;
    }
    .side-nav a:hover .sn-label { opacity: 1; transform: none; }
    .side-nav a:hover .sn-num { color: var(--ink); }
    .side-nav a.active .sn-num { color: var(--ink); }
    .side-nav a.active .sn-label { opacity: 1; transform: none; color: var(--ink); }
    .sn-top {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: row-reverse; align-items: center; gap: 10px;
      margin-bottom: 8px; padding: 0;
      font-family: var(--sans);
    }
    .sn-top-icon { font-size: 12px; color: #b6b1a8; transition: color .25s; }
    .sn-top-label {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0; transform: translateX(6px);
      transition: opacity .25s, transform .25s;
    }
    .sn-top:hover .sn-top-icon { color: var(--ink); }
    .sn-top:hover .sn-top-label { opacity: 1; transform: none; }

    /* ── Layout ── */
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 var(--pad); }
    section { padding: 110px 0; }
    .rule { height: 1px; background: var(--line-soft); max-width: 1180px; margin: 0 auto; }

    /* 대문 다음 바로 포트폴리오 */
    #portfolio { padding-top: 120px; }

    /* ── Intro (미사용 · 마크업 복구 시 대비) ── */
    #top { padding: 0; }
    #intro { padding-top: 152px; padding-bottom: 92px; }
    .intro-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 64px;
      align-items: end;
    }
    .hero-label {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 26px;
    }
    .hero-name {
      font-family: var(--serif);
      font-weight: 200;
      font-size: clamp(38px, 5.4vw, 68px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .hero-name .name-en {
      display: block;
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(11px, 1.3vw, 15px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-top: 20px;
    }
    .hero-bio {
      font-size: 15px;
      color: var(--ink-soft);
      line-height: 2;
      max-width: 460px;
      border-left: 1px solid var(--line);
      padding-left: 28px;
    }

    /* ── Section header ── */
    .section-header {
      display: flex; align-items: baseline; gap: 18px;
      margin-bottom: 50px;
    }
    .section-num { font-size: 10px; letter-spacing: 0.2em; color: var(--ink-soft); }
    .section-title {
      font-family: var(--serif);
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 200;
      letter-spacing: -0.01em;
    }
    .section-title small {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-left: 14px;
      vertical-align: middle;
    }

    /* ── Works ── */
    .gallery-filter { display: flex; gap: 9px; margin-bottom: 52px; flex-wrap: wrap; }
    .filter-btn {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      color: var(--ink-soft);
      padding: 7px 17px;
      transition: all .2s;
    }
    .filter-btn:hover { border-color: var(--ink-soft); color: var(--ink); }
    .filter-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

    .gallery-group { margin-bottom: 84px; }
    .gallery-group:last-child { margin-bottom: 0; }
    .gallery-group-h {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      padding-bottom: 14px;
      margin-bottom: 34px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: baseline; gap: 10px;
    }
    .gallery-group-h .g-count {
      font-size: 10px; letter-spacing: 0.08em;
      color: var(--ink-soft);
    }
    /* 정렬된 3열 격자 · 모든 칸은 같은 크기(4:3),
       작품은 자르지 않고 원본 비율 그대로 칸 안에 맞춰 아래쪽에 정렬 */
    .gallery-grid-inner {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 48px 30px;
    }
    .gallery-item { cursor: pointer; }
    .g-frame {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }
    .featured-item .g-frame::after {
      content: '';
      position: absolute; inset: 0;
      border: 1px solid rgba(0,0,0,0.06);
      pointer-events: none;
      z-index: 3;
    }
    .gallery-item img.g-img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center bottom;
      display: block;
      transition: transform .8s cubic-bezier(.2,.7,.3,1);
    }
    /* 마우스를 올리면 같은 작품의 다른 컷이 차례로 겹쳐 나타남 */
    .g-cycle {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center bottom;
      background: var(--paper);
      opacity: 0;
      transition: opacity .7s ease;
      z-index: 1;
    }
    .g-cycle.show { opacity: 1; }
    .g-clip {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0; transition: opacity .5s ease;
      z-index: 2;
    }
    .g-clip.show { opacity: 1; }
    .gallery-item:hover img.g-img { transform: scale(1.02); transform-origin: center bottom; }
    .g-view {
      position: absolute; left: 0; bottom: 0; z-index: 4;
      background: var(--ink); color: var(--paper);
      font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      padding: 8px 14px;
      opacity: 0; transform: translateY(6px);
      transition: opacity .3s, transform .3s;
    }
    .gallery-item:hover .g-view { opacity: 1; transform: translateY(0); }
    .g-count-badge {
      position: absolute; right: 10px; top: 10px; z-index: 4;
      font-size: 9px; letter-spacing: 0.14em;
      color: #fff; background: rgba(20,19,17,0.5);
      padding: 4px 8px;
      opacity: 0; transition: opacity .3s;
    }
    .gallery-item:hover .g-count-badge { opacity: 1; }
    .g-meta {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 14px; margin-top: 14px;
    }
    .g-title { font-size: 15px; font-weight: 300; letter-spacing: -0.01em; line-height: 1.5; }
    .g-year { font-size: 11px; letter-spacing: 0.1em; color: var(--ink-soft); white-space: nowrap; }
    .g-vid { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin-right: 10px; }
    .g-vid::before { content: '▶ '; font-size: 7px; vertical-align: 1px; }
    .gallery-item.ph-1 .g-frame, .gallery-item.ph-2 .g-frame, .gallery-item.ph-3 .g-frame,
    .gallery-item.ph-4 .g-frame, .gallery-item.ph-5 .g-frame, .gallery-item.ph-6 .g-frame { border: 1px solid var(--line-soft); }
    .g-desc {
      font-size: 12px; color: var(--ink-soft); line-height: 1.65;
      margin-top: 5px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* 영상 작품 표시 — 이미지를 가리지 않도록 모서리 배지로 */
    .yt-play-icon {
      position: absolute; left: 10px; top: 10px; z-index: 4;
      display: flex; align-items: center; gap: 6px;
      font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #fff;
      background: rgba(20,19,17,0.55);
      padding: 4px 9px 4px 8px;
      pointer-events: none;
    }
    .yt-play-icon::before { content: '▶'; font-size: 8px; }

    /* ── Selected Works (대표작 · 전체 폭) ── */
    .featured { margin-bottom: 110px; }
    .featured-item { cursor: pointer; margin-bottom: 96px; }
    .featured-item:last-child { margin-bottom: 0; }
    /* 대표작 칸은 격자용 4:3 비율을 따르지 않고 사진 높이에 딱 맞춤 */
    .featured-item .g-frame { aspect-ratio: auto; min-height: 240px; background: var(--paper-2); }
    .featured-item .g-frame.is-loaded { min-height: 0; }
    .featured-item img.g-img {
      width: 100%; height: auto;
      max-height: 82vh;
      object-fit: contain;
      display: block; margin: 0 auto;
      transition: transform 1.2s cubic-bezier(.2,.7,.3,1);
    }
    .featured-item:hover img.g-img { transform: scale(1.015); }
    .featured-item .g-cycle { object-fit: contain; object-position: center; background: var(--paper); }
    .featured-meta {
      display: grid;
      grid-template-columns: 1fr minmax(0, 420px);
      gap: 48px;
      align-items: start;
      margin-top: 26px;
    }
    .featured-title {
      font-family: var(--serif);
      font-weight: 200;
      font-size: clamp(20px, 2vw, 28px);   /* 긴 제목도 한 줄에 들어가도록 */
      line-height: 1.3;
      letter-spacing: -0.015em;
    }
    .featured-title .f-year {
      display: block;
      font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.18em;
      color: var(--ink-soft);
      margin-top: 12px;
    }
    .featured-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.8; padding-top: 8px; }
    /* 대표작 모서리의 Play video 버튼 (누르면 영상 재생) */
    .f-video-btn {
      pointer-events: auto; cursor: pointer;
      border: none; font-family: var(--sans);
      font-size: 10px; padding: 7px 12px 7px 10px;
      transition: background .2s;
    }
    .f-video-btn:hover { background: rgba(20,19,17,0.85); }
    .featured-more {
      display: inline-block; margin-top: 14px;
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px;
    }
    .gallery-item.ph-1 .g-frame { background: linear-gradient(160deg,#ded8d0,#cdc6bd); }
    .gallery-item.ph-2 .g-frame { background: linear-gradient(160deg,#d3d7dc,#c2c7ce); }
    .gallery-item.ph-3 .g-frame { background: linear-gradient(160deg,#dfd2cf,#cec0bc); }
    .gallery-item.ph-4 .g-frame { background: linear-gradient(160deg,#d0d9d3,#bfc9c2); }
    .gallery-item.ph-5 .g-frame { background: linear-gradient(160deg,#dedbcd,#ccc8b9); }
    .gallery-item.ph-6 .g-frame { background: linear-gradient(160deg,#d3cfda,#c1bcc9); }
    .gallery-empty { color: var(--ink-soft); font-size: 14px; padding: 20px 0; }

    /* ── CV ── */
    .cv-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 40px;
      padding: 32px 0;
      border-top: 1px solid var(--line-soft);
    }
    .cv-grid:last-child { border-bottom: 1px solid var(--line-soft); }
    .cv-category {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      position: sticky; top: 96px;
      align-self: start;
    }
    .cv-entries { }
    .cv-entry {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 20px;
      padding: 10px 0;
    }
    .cv-entry:last-child { padding-bottom: 0; }
    .cv-year { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; padding-top: 3px; }
    .cv-title { font-size: 15px; font-weight: 300; }
    .cv-detail { font-size: 13px; color: var(--ink-soft); margin-top: 1px; }

    /* ── Papers (논문) ── */
    .paper-list { display: flex; flex-direction: column; }
    .paper-item {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 36px;
      padding: 30px 0;
      border-top: 1px solid var(--line-soft);
    }
    .paper-item:last-child { border-bottom: 1px solid var(--line-soft); }
    .paper-year { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; padding-top: 6px; }
    .paper-title {
      font-family: var(--serif); font-size: 20px; font-weight: 300;
      line-height: 1.5; letter-spacing: -0.01em; margin-bottom: 6px;
      word-break: keep-all;
    }
    .paper-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; word-break: keep-all; }
    .paper-venue { font-size: 13.5px; color: var(--ink); }
    .paper-kw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .paper-kw span {
      font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-soft);
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
    }
    .paper-abs {
      font-size: 13.5px; color: var(--ink-soft); line-height: 1.9;
      max-width: 720px; margin-top: 14px; word-break: keep-all;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .paper-abs.is-long { cursor: pointer; }
    .paper-item.open .paper-abs { display: block; -webkit-line-clamp: unset; overflow: visible; }
    .paper-actions { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
    .paper-link {
      background: none; border: none; cursor: pointer; padding: 0 0 2px;
      font-family: var(--sans); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink); border-bottom: 1px solid var(--ink);
    }
    .paper-link:hover { color: var(--ink-soft); border-bottom-color: var(--ink-soft); }

    .paper-works { margin-top: 26px; }
    .paper-works-h {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-soft); margin-bottom: 12px;
    }
    .paper-works-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 760px; }
    .pw-item { cursor: pointer; background: none; border: none; padding: 0; text-align: left; font-family: var(--sans); color: var(--ink); }
    .pw-frame { aspect-ratio: 4 / 3; overflow: hidden; background: var(--paper-2); }
    .pw-frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.3,1); }
    .pw-item:hover .pw-frame img { transform: scale(1.04); }
    .pw-title {
      font-size: 11.5px; line-height: 1.5; margin-top: 7px; color: var(--ink-soft);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      word-break: keep-all;
    }
    .pw-item:hover .pw-title { color: var(--ink); }
    .paper-item { scroll-margin-top: 90px; }
    .paper-item.flash { animation: paperFlash 1.6s ease; }
    @keyframes paperFlash { 0%,40% { background: var(--paper-2); } 100% { background: transparent; } }
    .modal-related { text-align: center; margin-top: 10px; }
    .modal-related button {
      background: none; border: none; cursor: pointer; font-family: var(--sans);
      font-size: 11.5px; letter-spacing: 0.04em; color: rgba(246,244,239,0.85);
      border-bottom: 1px solid rgba(246,244,239,0.4); padding: 0 0 2px;
    }
    .modal-related button:hover { color: #fff; border-bottom-color: #fff; }

    /* ── Exhibitions ── */
    .exhibition-list { display: flex; flex-direction: column; }
    .exhibition-item {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      align-items: start;
      gap: 36px;
      padding: 28px 0;
      border-top: 1px solid var(--line-soft);
    }
    .exhibition-item:last-child { border-bottom: 1px solid var(--line-soft); }
    .exhibition-item.is-current { background: var(--paper-2); padding-left: 24px; padding-right: 24px; }
    .ex-date { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; padding-top: 6px; }
    .ex-title { font-family: var(--serif); font-size: 20px; font-weight: 300; margin-bottom: 5px; letter-spacing: -0.01em; }
    .ex-venue { font-size: 13.5px; color: var(--ink); }
    .ex-location { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
    .ex-badge {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
      margin-top: 6px;
    }
    .ex-badge.current { background: var(--ink); color: var(--paper); }
    .ex-badge.upcoming { background: transparent; border: 1px solid var(--ink); color: var(--ink); }
    .ex-badge.past { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }

    /* ── Contact ── */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 88px;
      align-items: start;
    }
    .contact-text {
      font-family: var(--serif);
      font-size: clamp(21px, 2.3vw, 29px);
      font-weight: 200;
      line-height: 1.55;
      margin-bottom: 38px;
    }
    .contact-links { display: flex; flex-direction: column; }
    .contact-link {
      display: flex; align-items: center; gap: 20px;
      color: var(--ink);
      font-size: 14px;
      padding: 14px 0;
      border-top: 1px solid var(--line-soft);
    }
    .contact-links .contact-link:last-child { border-bottom: 1px solid var(--line-soft); }
    .contact-link-label {
      width: 90px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .contact-link-val { border-bottom: 1px solid transparent; transition: border-color .2s; }
    .contact-link:hover .contact-link-val { border-color: var(--ink); }

    .contact-form { display: flex; flex-direction: column; gap: 22px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .form-group input,
    .form-group textarea {
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 11px 0;
      font-size: 14px;
      font-family: var(--sans);
      font-weight: 300;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
      resize: none;
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color: #b6b1a8; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--ink); }
    .form-group textarea { min-height: 96px; }
    .btn-submit {
      align-self: flex-start;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      padding: 13px 34px;
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .btn-submit:hover { background: transparent; color: var(--ink); }
    .btn-submit[disabled] { opacity: .45; cursor: default; }
    .form-status {
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--ink-soft);
      min-height: 1.2em;
      margin-top: -6px;
    }
    .form-status.ok  { color: var(--ink); }
    .form-status.err { color: #a8443c; }
    .form-status a { border-bottom: 1px solid currentColor; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--line);
      padding: 36px var(--pad);
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .footer-name { font-family: var(--serif); font-size: 14px; letter-spacing: 0.04em; }
    .footer-copy { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; }

    /* ── Modal ── */
    .modal-bg {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(20,19,17,0.95);
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal-wrap { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; }
    .modal-inner { position: relative; max-width: 1000px; width: 88%; }
    /* 이미지 실제 크기에 딱 맞는 상자 — 닫기 버튼이 이미지 모서리에 붙도록 */
    .modal-stage {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      line-height: 0;
    }
    .modal-img {
      max-width: 100%;
      max-height: 76vh;
      width: auto; height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .modal-video-wrap { position: relative; width: min(88vw, 1000px); padding-top: 56.25%; }
    .modal-video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .modal-ph {
      background: #2a2825; width: min(70vw, 520px); aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      color: #6b6862; font-size: 11px; letter-spacing: 0.24em;
    }
    .modal-caption {
      color: rgba(246,244,239,0.72);
      font-size: 12.5px;
      letter-spacing: 0.03em;
      line-height: 1.7;
      margin-top: 16px;
      text-align: center;
    }
    .modal-close {
      position: absolute; top: 10px; right: 10px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20,19,17,0.55);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(246,244,239,0.25);
      border-radius: 50%;
      color: rgba(246,244,239,0.9);
      font-size: 20px; line-height: 1;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
      z-index: 210;
    }
    .modal-close:hover {
      background: rgba(20,19,17,0.85);
      border-color: rgba(246,244,239,0.6);
      color: #fff;
    }
    .modal-arrow {
      position: absolute; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(246,244,239,0.6);
      font-size: 26px; cursor: pointer;
      padding: 16px;
      transition: color .2s;
      z-index: 205;
    }
    .modal-arrow:hover { color: #fff; }
    .modal-arrow-prev { left: -58px; }
    .modal-arrow-next { right: -58px; }
    .modal-arrow.hidden { display: none; }
    .modal-dots { display: flex; justify-content: center; gap: 7px; margin-top: 18px; }
    .modal-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(246,244,239,0.3);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .modal-dot.active { background: rgba(246,244,239,0.95); transform: scale(1.2); }

    /* ── 전송 완료 팝업 ── */
    .sent-bg {
      display: none;
      position: fixed; inset: 0; z-index: 400;
      background: rgba(20,19,17,0.5);
      backdrop-filter: blur(3px);
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .sent-bg.open { display: flex; animation: sentFade .25s ease both; }
    @keyframes sentFade { from { opacity: 0; } to { opacity: 1; } }
    .sent-card {
      background: var(--paper);
      border: 1px solid var(--line);
      max-width: 420px; width: 100%;
      padding: 44px 40px 36px;
      text-align: center;
      animation: sentPop .32s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes sentPop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    .sent-check {
      width: 46px; height: 46px; margin: 0 auto 20px;
      border: 1px solid var(--ink);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; color: var(--ink);
    }
    .sent-title {
      font-family: var(--serif);
      font-size: 21px; font-weight: 300;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }
    .sent-text {
      font-size: 13.5px; line-height: 1.8;
      color: var(--ink-soft);
      margin-bottom: 28px;
      word-break: keep-all;
    }
    .sent-actions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
      margin: -12px 0 26px;
    }
    .sent-actions:empty { display: none; }
    .sent-action {
      font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.1em;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      padding: 8px 16px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .sent-action:hover { border-color: var(--ink); color: var(--ink); }
    .sent-btn {
      background: var(--ink); color: var(--paper);
      border: 1px solid var(--ink);
      font-family: var(--sans);
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      padding: 12px 34px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .sent-btn:hover { background: transparent; color: var(--ink); }

    /* ── Gate (대문) ── */
    /* 첫 화면 : 클릭 없이 스크롤하면 바로 작품으로 이어지는 전체화면 영역 */
    #gate {
      position: relative;
      height: 100vh; height: 100svh;
      min-height: 480px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #171614;
      overflow: hidden;
      cursor: default;
    }
    .gate-bg {
      position: absolute; inset: 0;
      background-color: var(--gate-tint, #2a2825);
      background-image: var(--gate-art, none);
      background-size: cover;
      background-position: center;
      animation: gateZoom 10s ease-out forwards;
    }
    @keyframes gateZoom { from { transform: scale(1.10); } to { transform: scale(1.0); } }
    /* 배경 영상 (mp4 또는 유튜브) — 로드되면 이미지 위로 서서히 나타남 */
    .gate-video {
      position: absolute; inset: 0;
      overflow: hidden;
      opacity: 0; transition: opacity .8s ease;
      pointer-events: none;
    }
    .gate-video.show { opacity: 1; }
    .gate-video video {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
    }
    .gate-video iframe {
      position: absolute; top: 50%; left: 50%;
      width: 100vw; height: 56.25vw;          /* 16:9 */
      min-width: 177.78vh; min-height: 100vh; /* 화면을 꽉 채우도록 */
      transform: translate(-50%, -50%) scale(1.18);   /* 가장자리의 유튜브 제목·로고가 보이지 않도록 확대 */
      border: 0;
    }
    .gate-veil {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(15,14,13,0.44), rgba(15,14,13,0.16) 38%, rgba(15,14,13,0.64));
    }
    .gate-inner {
      position: relative; z-index: 2;
      text-align: center;
      color: #f6f4ef;
      padding: 0 24px;
      animation: gateIn 1.4s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes gateIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .gate-label {
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(246,244,239,0.72);
      margin-bottom: 26px;
    }
    .gate-name-ko {
      font-family: var(--serif);
      font-weight: 200;
      font-size: clamp(34px, 5.4vw, 68px);
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    }
    /* 영문 이름은 라틴 글자가 한글보다 크게 보여서 한 단계 작게 */
    .gate-name-ko.is-en { font-size: clamp(28px, 4vw, 52px); letter-spacing: 0.01em; }
    .gate-name-en {
      display: block;
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(10px, 0.95vw, 12px);
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: rgba(246,244,239,0.82);
      margin-top: 18px;
      padding-left: 0.36em;
    }
    .gate-work {
      position: absolute; left: var(--pad); bottom: 40px;
      z-index: 2;
      font-size: 11px; letter-spacing: 0.12em;
      color: rgba(246,244,239,0.7);
      max-width: 50%;
      animation: gateIn 1.8s cubic-bezier(.2,.7,.3,1) both;
    }
    .gate-enter {
      position: absolute; left: 50%; bottom: 30px;
      transform: translateX(-50%);
      z-index: 2;
      background: none; border: none; cursor: pointer;
      font-family: var(--sans);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(246,244,239,0.85);
      padding: 8px 12px 0 calc(12px + 0.3em);
    }
    .gate-enter::after {
      content: '';
      width: 1px; height: 38px;
      background: linear-gradient(to bottom, rgba(246,244,239,0.85), rgba(246,244,239,0));
      transform-origin: top;
      animation: gateLine 2.4s ease-in-out infinite;
    }
    @keyframes gateLine {
      0%   { transform: scaleY(0); opacity: 1; }
      60%  { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(1); opacity: 0; }
    }

    /* 첫 화면 위에 있을 때 상단 메뉴는 투명 + 밝은 글자 */
    nav.on-hero { background: transparent; backdrop-filter: none; border-bottom-color: transparent; }
    nav.on-hero .nav-name,
    nav.on-hero .nav-links a,
    nav.on-hero .lang-btn { color: rgba(246,244,239,0.82); }
    nav.on-hero .nav-links a:hover,
    nav.on-hero .lang-btn.active { color: #fff; border-bottom-color: #fff; }
    nav.on-hero .nav-lang .lang-btn + .lang-btn { border-left-color: rgba(246,244,239,0.35); }
    nav, .nav-name, .nav-links a, .lang-btn { transition: background .35s, color .35s, border-color .35s; }
    .side-nav { transition: opacity .35s; }
    .side-nav.on-hero { opacity: 0; pointer-events: none; }

    /* ── Reveal ── */
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.in { opacity: 1; transform: none; }

    /* ── Responsive ── */
    @media (max-width: 1200px) { .side-nav { display: none; } }
    @media (max-width: 780px) {
      .gallery-grid-inner { grid-template-columns: repeat(2, 1fr); gap: 36px 20px; }
      .featured-meta { grid-template-columns: 1fr; gap: 10px; }
      .featured-item { margin-bottom: 72px; }
    }
    @media (max-width: 900px) {
      :root { --pad: 24px; }
      .intro-grid { grid-template-columns: 1fr; gap: 32px; align-items: start; }
      .hero-bio { border-left: none; padding-left: 0; border-top: 1px solid var(--line); padding-top: 24px; }
      .cv-grid { grid-template-columns: 1fr; gap: 12px; }
      .cv-category { position: static; }
      .exhibition-item { grid-template-columns: 1fr; gap: 10px; }
      .paper-item { grid-template-columns: 1fr; gap: 8px; }
      .paper-year { padding-top: 0; }
      .paper-works-grid { grid-template-columns: repeat(2, 1fr); }
      .contact-grid { grid-template-columns: 1fr; gap: 56px; }
      footer { flex-direction: column; text-align: center; }
      .modal-arrow-prev { left: -8px; }
      .modal-arrow-next { right: -8px; }
      .modal-inner { width: 92%; }
    }
    @media (max-width: 640px) {
      section { padding: 76px 0; }
      #portfolio { padding-top: 96px; }
      #intro { padding-top: 118px; padding-bottom: 56px; }
      .gallery-grid-inner { grid-template-columns: repeat(2, 1fr); gap: 28px 14px; }
      .featured { margin-bottom: 72px; }
      .g-desc { display: none; }
      nav { padding: 0 18px; height: 56px; }
      .nav-name { font-size: 14px; }
      .nav-links { gap: 13px; }
      .nav-links a { font-size: 9.5px; letter-spacing: 0.05em; }
      .lang-btn { font-size: 9px; letter-spacing: 0.06em; }
      .nav-lang { gap: 6px; margin-left: 0; }
      .nav-lang .lang-btn + .lang-btn { padding-left: 7px; }
      .gate-work { left: 0; right: 0; bottom: 96px; max-width: none; text-align: center; font-size: 10px; padding: 0 24px; }
      .gate-enter { bottom: 22px; }
    }
    @media (max-width: 560px) {
      .nav-name { display: none; }
      .nav-links { width: 100%; justify-content: space-between; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gate-bg { animation: none; }
      .gate-inner, .gate-work { animation: none; }
      .gate-enter::after { animation: none; }
      .gate-video { display: none; }
      .reveal { transition: none; opacity: 1; transform: none; }
    }
  </style>
</head>

<body>

<!-- ── Gate · 첫 화면 (대표 영상 / 최근 작품 전체화면, 스크롤하면 바로 작품으로) ── -->
<header id="gate">
  <div class="gate-bg" id="gateBg"></div>
  <div class="gate-video" id="gateVideo" aria-hidden="true"></div>
  <div class="gate-veil"></div>
  <div class="gate-inner">
    <p class="gate-label" id="gateLabel"></p>
    <h1 class="gate-name-ko" id="gateNameKo"></h1>
    <span class="gate-name-en" id="gateNameEn"></span>
  </div>
  <p class="gate-work" id="gateWork"></p>
  <button type="button" class="gate-enter" id="gateEnter">Works</button>
</header>

<!-- ── Navigation ── -->
<nav id="nav">
  <a class="nav-name" href="#portfolio" id="navName">최영환</a>
  <ul class="nav-links">
    <li><a href="#portfolio">Works</a></li>
    <li class="nav-papers"><a href="#papers">Texts</a></li>
    <li><a href="#cv">CV</a></li>
    <li><a href="#exhibitions">Exhibitions</a></li>
    <li><a href="#contact">Contact</a></li>
    <li class="nav-lang">
      <button class="lang-btn active" id="btnKo" onclick="setLang('ko')">KOR</button>
      <button class="lang-btn"        id="btnEn" onclick="setLang('en')">ENG</button>
    </li>
  </ul>
</nav>

<!-- ── Side Nav (scroll follower) ── -->
<aside class="side-nav">
  <button class="sn-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="sn-top-icon">↑</span>
    <span class="sn-top-label">Top</span>
  </button>
  <a href="#portfolio"><span class="sn-num">01</span><span class="sn-label">Works</span></a>
  <a href="#papers" class="nav-papers"><span class="sn-num">02</span><span class="sn-label">Texts</span></a>
  <a href="#cv"><span class="sn-num" data-n="cv">03</span><span class="sn-label">CV</span></a>
  <a href="#exhibitions"><span class="sn-num" data-n="exhibitions">04</span><span class="sn-label">Exhibitions</span></a>
  <a href="#contact"><span class="sn-num" data-n="contact">05</span><span class="sn-label">Contact</span></a>
</aside>

<!-- ── 01 Portfolio (대문 다음 바로 시작) ── -->
<section id="portfolio">
  <div class="wrap">
    <div class="section-header">
      <span class="section-num">01</span>
      <h2 class="section-title">Works<small id="secWorks">포트폴리오</small></h2>
    </div>
    <div class="gallery-filter" id="galleryFilter"></div>
    <div id="galleryGrid" class="gallery-grid"></div>
  </div>
</section>

<div class="rule"></div>

<!-- ── 02 Texts (글·논문) — 작업에 관한 글. 데이터가 없으면 섹션과 메뉴가 자동으로 숨겨집니다 ── -->
<section id="papers">
  <div class="wrap">
    <div class="section-header">
      <span class="section-num">02</span>
      <h2 class="section-title">Texts<small id="secPapers">글 · 논문</small></h2>
    </div>
    <div class="paper-list" id="paperList"></div>
  </div>
</section>

<div class="rule" id="papersRule"></div>

<!-- ── 03 CV ── -->
<section id="cv">
  <div class="wrap">
    <div class="section-header">
      <span class="section-num" data-n="cv">03</span>
      <h2 class="section-title">CV<small id="secCv">약력</small></h2>
    </div>
    <div id="cvContainer"></div>
  </div>
</section>

<div class="rule"></div>

<!-- ── 04 Exhibitions ── -->
<section id="exhibitions">
  <div class="wrap">
    <div class="section-header">
      <span class="section-num" data-n="exhibitions">04</span>
      <h2 class="section-title">Exhibitions<small id="secEx">전시 소식</small></h2>
    </div>
    <div class="exhibition-list" id="exhibitionList"></div>
  </div>
</section>

<div class="rule"></div>

<!-- ── 05 Contact ── -->
<section id="contact">
  <div class="wrap">
    <div class="section-header">
      <span class="section-num" data-n="contact">05</span>
      <h2 class="section-title">Contact<small id="secContact">문의</small></h2>
    </div>
    <div class="contact-grid">
      <div>
        <p class="contact-text" id="contactText"></p>
        <div class="contact-links" id="contactLinks"></div>
      </div>
      <form class="contact-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label id="labelName" for="inputName">이름 / Name</label>
          <input type="text" id="inputName" name="name" autocomplete="name" required placeholder="성함을 입력해 주세요." />
        </div>
        <div class="form-group">
          <label id="labelEmail" for="inputEmail">이메일 / Email</label>
          <input type="email" id="inputEmail" name="email" autocomplete="email" required placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label id="labelMsg" for="inputMsg">메시지 / Message</label>
          <textarea id="inputMsg" name="message" required placeholder="문의 내용을 입력해 주세요."></textarea>
        </div>
        <button type="submit" class="btn-submit">Send</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>

<!-- ── Footer ── -->
<footer>
  <span class="footer-name" id="footerName"></span>
  <span class="footer-copy" id="footerCopy"></span>
</footer>

<!-- ── 전송 완료 팝업 ── -->
<div class="sent-bg" id="sentPopup" role="dialog" aria-modal="true" aria-labelledby="sentTitle">
  <div class="sent-card">
    <div class="sent-check">✓</div>
    <h3 class="sent-title" id="sentTitle"></h3>

","images/upmq2cs88d_003_thumb.jpg","images/upmq2cs88d_004_thumb.jpg","images/upmq2cs88d_007_thumb.jpg","images/upmq2cs88d_008_thumb.jpg","images/upmq2doh14_004_thumb.jpg","images/upmq2doh14_005_thumb.jpg","images/upmq2doh14_006_thumb.jpg"],"images_full":["images/upmq2cs88d_001_full.jpg","images/upmq2cs88d_002_full.jpg","images/upmq2cs88d_003_full.jpg","images/upmq2cs88d_004_full.jpg","images/upmq2cs88d_007_full.jpg","images/upmq2cs88d_008_full.jpg","images/upmq2doh14_004_full.jpg","images/upmq2doh14_005_full.jpg","images/upmq2doh14_006_full.jpg"]},{"category":"installation","title":"원치 않는 이주의 경험이 당신의 삶을 어떻게 변화시켰습니까?(관객참여형 설치작품)","titleEn":"How Has the Experience of Unwanted Displacement Changed Your Life? (participatory installation)","year":"2018","desc":"4채널 사운드 설치, 엽서, 펜, 가변크기","descEn":"Four-channel sound installation, postcards, pens, dimensions variable","images_thumb":["images/upmq3s8c03_002_thumb.jpg","images/upmq3s8c03_003_thumb.jpg","images/upmq3s8c03_004_thumb.jpg","images/upmq3s8c03_005_thumb.jpg"],"images_full":["images/upmq3s8c03_002_full.jpg","images/upmq3s8c03_003_full.jpg","images/upmq3s8c03_004_full.jpg","images/upmq3s8c03_005_full.jpg"]},{"category":"installation","title":"하이브리드","titleEn":"Hybrid","year":"2007","desc":"나뭇가지, 철봉, 재활용 캔, 스티로폼, 35 x 35 x 57 인치 (2점)","descEn":"a Branch of a tree, Steel bar, Recycle can, Styrofoam, 35 x 35 x 57 inches(x 2)","images_thumb":["images/upmq3uavec_001_thumb.jpg","images/upmq3uavec_002_thumb.jpg"],"images_full":["images/upmq3uavec_001_full.jpg","images/upmq3uavec_002_full.jpg"]},{"category":"collage","title":"성실한 위증","titleEn":"The Honest Perjury","year":"2026","desc":"캔버스 위에 아크릴 물감, 사진, 실, 침핀, OHP필름, LCD 모니터(SD 영상 1:30), 85 x 55 cm","descEn":"Acrylic paint, photographs, thread, pins, OHP film on canvas, LCD monitor (SD video, 1:30), 85 × 55 cm","images_thumb":["images/honest_perjury_01.jpg","images/honest_perjury_02.jpg","https://youtu.be/AJQhW7RAWNU"],"images_full":["images/honest_perjury_01.jpg","images/honest_perjury_02.jpg","https://youtu.be/AJQhW7RAWNU"]}],"papers":[{"year":"2026","title":"생성형 AI 이미징에서 텍스트와 시각언어의 간극에 관한 연구","titleEn":"A Study on the Gap between Text and Visual Language in Generative AI Imaging","subtitle":"오역의 유형과 작가의 판단을 중심으로","subtitleEn":"Focused on Types of Mistranslation and the Artist's Judgment","journal":"","journalEn":"","keywords":["시각언어","생성형 AI","표기","오역","시각 관습","작가성"],"keywordsEn":["visual language","generative AI","notation","mistranslation","visual convention","authorship"],"abstract":"본 연구는 생성형 AI 이미징을 작품의 전부 또는 일부에 사용하는 작가의 자리에서, 텍스트가 시각언어를 어디까지 규정할 수 있는가를 검토하였다. 먼저 서양 미술사에서 텍스트가 시각언어에 개입해 온 방식을 코수스, 르윗, 위너, 발데사리로 이어지는 실행문의 계보와, 말라르메에서 초기 아방가르드 타이포그래피와 구체시를 거쳐 쉬빙으로 이어지는 형상의 계보로 정리하였다. 이어 굿맨의 표기 이론과 백샌덜의 그림 묘사론을 바탕으로, 텍스트와 시각언어는 서로 다른 원리를 따르는 언어이므로 텍스트는 시각언어를 온전히 규정하기 어렵고, 둘의 관계는 규정이 아니라 번역에 가깝다는 점을 논의하였다. 또한 보티첼리의 ⟨아펠레스의 중상⟩, 모세의 뿔, 뒤러의 ⟨코뿔소⟩, 뒤샹의 미술 계수를 검토하여 이 번역에서 생기는 오역을 미결정의 충전, 경로의 분기, 관습의 고착, 의도와 실현의 격차, 전략적 오역의 다섯 유형으로 제시하였다. 생성 모델은 조형 요소를 정하지만 판단하지는 않으며, 결과에 의미를 부여하는 판단은 작가에게만 가능하다. 그러나 모델은 언어의 필터, 평균으로의 수렴, 고착을 통해 이 간극을 그럴듯한 이미지로 가리는 경향이 있다. 본 연구는 오역을 먼저 판별해야 할 대상으로 보고, 숀의 반성적 실천론과 폴라니의 암묵지 개념을 바탕으로 그 판별 능력이 생성 이전의 조형 경험, 관습에 대한 지식, 의도를 바깥에 남기는 습관, 본 것을 말로 기술하는 능력으로 이루어지며 구체적인 실천을 통해 길러진다고 논의하였다. 이 관점에서 생성형 AI를 통한 작업은 모델 안에 압축된 시각 관습, 그리고 아직 언어가 되지 못한 작가 자신과 나누는 비대칭적 대화로 읽을 수 있으며, 작가성의 중요한 근거는 그 대화 속에서 결과를 거듭 읽고 고쳐 나가며 무엇을 택할지 판단하는 데에서 찾을 수 있다.","abstractEn":"This study examines, from the standpoint of artists who use generative AI imaging for all or part of their work, to what extent text can define visual language. It first traces two lineages of text in Western art: text as instruction, from Kosuth, LeWitt, and Weiner to Baldessari, and text as form, from Mallarmé through early avant-garde typography and concrete poetry to Xu Bing. Drawing on Goodman's theory of notation and Baxandall's account of pictorial description, it argues that text and visual language follow different principles, so that text can hardly define visual language in full and their relation is closer to translation than to definition. Examining Botticelli's Calumny of Apelles, the horned Moses, Dürer's Rhinoceros, and Duchamp's art coefficient, it identifies five types of mistranslation arising in this translation: the filling of indeterminacy, divergence of transmission paths, fixation of convention, the gap between intention and realization, and strategic mistranslation. The model determines formal elements but does not judge; only the artist can make the judgment that gives a result its meaning. Yet the model tends to conceal this gap with plausible images through the filtering of language, convergence toward convention, and fixation. Treating mistranslation as something to be discerned first, the study draws on Schön's reflective practice and Polanyi's tacit knowledge to argue that this discernment consists of pre-generative formal experience, knowledge of visual conventions, the habit of externalizing intention, and the ability to describe what one sees, and that it is cultivated through concrete practices. Art-making with generative AI can thus be read as an asymmetric dialogue with the visual conventions compressed within the model and with the artist's own not-yet-articulated intentions, and an important ground of authorship lies in repeatedly reading and revising results and judging what to choose within that dialogue.","pdf":"papers/choi-younghwan_2026_generative-ai-imaging.pdf","url":"","works":[{"title":"다이얼로그","category":"video"},{"title":"다이얼로그","category":"photography"}],"pdfSize":"1MB"},{"year":"2021","title":"공동체 미술을 통한 사회관계 회복에 관한 연구","titleEn":"A Study on the Recovery of Social Relationships through Community Art","subtitle":"본인의 프로젝트를 중심으로","subtitleEn":"Focusing on the Artist's Own Projects","journal":"미술박사 학위논문, 서울대학교 대학원 미술학과 서양화·판화 전공 (지도교수 윤동천)","journalEn":"DFA Dissertation, Painting and Printmaking, Department of Fine Arts, Graduate School, Seoul National University","keywords":["도심 재개발","공동체 미술","개체화된 공동체","공론장","감각적 사유","공유경험","사회관계"],"keywordsEn":["Urban Redevelopment","Community Art","Individualized Community","Public Sphere","Sensory Thinking","Sharing Experience","Social Relationships"],"abstract":"미술가로서 연구자가 미술의 사회적 기능과 역할에 관심을 가진 이래로 도심 재개발에서 비롯된 사회문제는 오랜 기간 천착해 온 소재이다. 재개발 찬성과 반대로 의견이 나뉘어 발생하는 공동체 구성원 사이 갈등과 영세한 거주민의 주거 불안은 연구자가 구성원 간 사회관계의 중요성을 자각하는 계기가 되었다. 이 논문의 목적은 연구자가 도심 재개발 지역에 거주하는 공동체 구성원과 협업으로 수행한 공동체 미술 프로젝트를 분석함으로써 공동체 미술이 재개발 과정에서 훼손된 구성원 사이 사회관계 회복과 확장에 미친 영향을 살피고, 궁극적으로 미술을 통한 사회 참여의 의의를 밝히는 데 있다.\n\n공동체 미술은 1960, 70년대 사회문제에 적극적으로 개입함으로써 대중의 비판적 사고와 행동을 촉구했던 행동주의 미술에 바탕을 두고 있다. 당대 행동주의 미술은 미술제도, 민주주의, 민족주의, 페미니즘 등 거대 사회 담론을 전통적인 미술 매체뿐만 아니라, 시위, 교육, 출판, 방송, 영화 등 비-전통적 미술 실천을 통해 대중에게 전달했다. 1980년대 이후 자본주의와 신자유주의의 팽창은 계층 간 경제적 불평등의 문제로 그 사회적 인식이 옮겨가는 계기가 되었다. 이에 따라, 행동주의 미술은 사회 주변부, 소외 계층, 그리고 공동체의 문제를 미시적으로 다루는 경향을 띠게 된다. 이 과정에서 구성원의 삶의 문제를 작품의 주제로 삼아, 공동체와 협업하고 연대하는 실천인 공동체 미술이 탄생하게 된다. 이처럼, 공동체 미술에서는 구성원의 실질적인 삶에 관한 논의의 장소 또는 공론장으로서 공공영역의 정치적 측면이 강조된다.\n\n연구자가 수행한 공동체 미술에서 구성원의 주체적 참여는 그 핵심이다. 그들의 능동적 참여는 구성원에게 내재한 평등한 능력을 입증하는 행위이다. 공동체 미술 실천 과정에서 연구자는 구성원의 생각을 지속해서 경청하고 공감을 표함으로써 구성원이 자기 삶의 주체로서 자기 역량을 자각하고, 발휘할 수 있는 환경을 조성한다. 연구자와 구성원 사이 개별 접촉을 통해 형성된 ‘관계’는, 궁극적으로, 구성원의 능동적인 참여를 유도하는 기반이 된다. 아울러, 그 접촉 방식은 재개발에서 비롯된 공동체의 쟁점에 관한 구성원의 다양한 생각과 주장을 조사하고, 프로젝트에 반영하는 방법론이다. 구성원의 개별성과 독립성의 강조는 현대사회에서 개체화되어 가는 공동체의 특징을 반영한 결과이다.\n\n개체화된 공동체와 협업으로 연구자가 수행하는 공동체 미술에서 텍스트와 대화는 구성원이 공론장에 참여하기 위해 사용하는 매개이다. 구성원은 자기 생각과 주장을 텍스트로 표현하거나, 타인과 대화하는 방식으로 공론장에 참여한다. 각각 프로젝트에서 그 언어는 비-전통적 매체에 담겨 미술 형식으로 전환된다. 공동체 미술을 통해 형성된 공론장의 요체는 구성원의 사고가 미술 실천을 통해 감각적으로 발화되고, 전달되는 것이다. 여기서 감각은 이성의 반대 개념이기보다는 미적 판단과 이성적 사유를 포괄하는 의미로, 구성원이 감정을 이입하고, 자기 생각을 표현하는 상태 그리고 관객이 구성원의 행위를 지각하고 공동체의 쟁점을 이해하는 방식을 말한다. 일반적인 공론장이 이성적 사유를 통해 타인을 설득하고 합의를 하는 것에 목적이 있다면, 감각적 사유를 통한 공론장의 목적은, 미술품에 관한 관객의 주관적 인식을 평가할 수 없듯이, 특정한 결론을 내려 시시비비를 가리기보다는 다양한 사고를 공유하고, 그 생각의 차이를 인식하는 것에 있다.\n\n따라서, 이 연구에서 공동체 미술을 통한 사회관계 회복 혹은 확장이 의미하는 바는 구성원 사이 반목을 없애는 것이 아니라 각자 삶의 태도에서 비롯된 생각의 차이를 수용하는 조건을 찾는 것이다. 특별히, 연구자가 수행한 공동체 미술 실천에서 구성원이 한 장소에 모여 자기 언어를 통해 각자의 생각을 공유한 경험은 그 관계 회복의 필수적인 요소이다. 공동체 미술의 공유경험은 구성원이 타인과 소통하는 방법을 구상하고, 삶의 변화를 위한 장기적이고, 점진적인 사고를 시작하는 계기인 것이다.\n\n여러 한계에도 불구하고, 이 연구는 사회변화가 거대 담론이나 권위를 가진 집단이 아닌, 공동체 구성원의 주체적 의지와 개별적 사고를 교류하는 과정에서 시작될 수 있음을 시사한다. 아울러, 개체화된 사회에서 공동체 구성원의 참여를 끌어내는 공동체 미술 방법론을 제시하고, 공동체 미술을 통한 사회 참여의 의의가 점진적인 과정을 통해 사회관계를 회복, 확장하고, 궁극적으로, 사회변화를 추동하는 것에 있음을 논증했다는 데 의의가 있다.","abstractEn":"Since I have been interested in the social functions and roles of art as artists, social problems stemming from urban redevelopment have long been discovered. Conflicts between members of the community, which are divided in opinion against the pros and cons of redevelopment, and residential anxiety among poor residents have become an opportunity for me to realize the importance of social relations in the community. The purpose of this thesis is to analyze Community Art projects conducted by myself in collaboration with community members living in redevelopment areas to examine the impact of community art on recovering and expanding social relationships.\n\nCommunity Art is based on Activist Art, which called for critical thinking and action by actively intervening in social issues in the 1960s and 1970s. Those days, Activist Art delivered metadiscourse such as art institutions, democracy, nationalism and feminism to the public through traditional art and non-traditional art practices such as demonstrations, education, publishing, broadcasting, and cinema. Since the 1980s, the expansion of capitalism and neoliberalism has led to a shift in social awareness to the problem of economic inequality between classes. Accordingly, Activist Art tended to micro-treat problems in the periphery of society, the underprivileged, or the community. In the process, Community Art, a practice of collaborating and solidifying with the community, using the problems of members' lives as the theme of the work, is created. As such, in Community Art, the political aspects of the public domain are emphasized as a place of discussion or a public sphere.\n\nThe independence of members in Community Art conducted by myself is key. Independence is demonstrated through active participation as an act of demonstrating the equal ability inherent in members. I continue to listen to members' thoughts and express empathy to create an environment in which members can recognize and exercise their capabilities as equal subjects. These relationships formed through individual contact are the groundwork for inducing active participation of members. In addition, the contact method is a methodology that examines and reflects various ideas and arguments of members on community issues arising from redevelopment in projects. As a public sphere, Community Art is a place where members of different ideas interact, a result of reflecting the characteristics of communities becoming individualized in modern society.\n\nText and Dialogue in the Community Art are the medium that members use to participate in public sphere. Members participate in the public sphere by expressing their thoughts and arguments in text or by talking to others. In each project, the language is translated into art form in a non-traditional medium. The key point of the public sphere is that members' thoughts are sensuously expressed and conveyed through art practice. The ‘Sense’ is more about aesthetic judgment and rational thinking than the opposite concept of thinking, which refers to the state in which members engage in emotions, express their thoughts, and the way in which the audience perceives members' actions and understands community issues. A general public sphere aims to persuade and reach agreement with others through rational reasons. In comparison with general public sphere, the purpose of the public sphere through ‘sensory thinking’ of Community Art is to share various ideas and recognize differences rather than to make certain conclusions, just as it cannot evaluate the audience's subjective perception of art cannot be evaluated.\n\nAs such, the meaning of recovering or expanding social relations through Community Art is not to eliminate antagonism among members, but to find conditions that accept differences in ideas stemming from the attitudes of others' lives. In this thesis, the experience of members gathering in one place and sharing their thoughts through art language is an essential factor in restoring the relationship. The Sharing Experience of Community Art is an opportunity for members to devise ways to communicate with others and begin long-term and gradual thinking for life change.\n\nDespite many limitations, this thesis suggests that social change can begin in the process of exchanging individual thoughts with the subject will of community members, not with metadiscourse or authoritative groups. It is also meaningful that it presented a Community Art methodology that draws community members' participation in individualized society, and argued that the meaning of social participation through Community Art was to recover and expand social relations and, ultimately, drive social change.","pdf":"papers/choi-younghwan_2021_dissertation.pdf","url":"","works":[{"title":"Letters from Griffintown (Griffintown 주민과 협업)","year":"2010"},{"title":"사라지기 쉬운 현수막 (성북동 주민과 협업)","year":"2014"},{"title":"동네스토리닷컴 Dongnestory.com (한시적 방송국-성북동 주민들과 협업)"},{"title":"깨진방 프로젝트 / 노인 주거 환경을 위한 공론장 (망원동 홀몸어르신과 협업)"}],"pdfSize":"13MB"}],"exhibitions":[{"date":"2025","title":"다이얼로그","venue":"강남꼬뮨갤러리","location":"서울, 한국","status":"past","titleEn":"Dialogue","venueEn":"Gangnam Commune Gallery","locationEn":"Seoul, Korea"},{"date":"2024","title":"백가쟁명","venue":"강남꼬뮨갤러리","location":"서울, 한국","status":"past","titleEn":"Contending Voices","venueEn":"Gangnam Commune Gallery","locationEn":"Seoul, Korea"},{"date":"2022","title":"우리는 무엇을 위해 싸우는가?","venue":"오뉴월 이주원","location":"서울, 한국","status":"past","titleEn":"What Are We Fighting For?","venueEn":"Oneuwol Ijuwon","locationEn":"Seoul, Korea"},{"date":"2018","title":"당신의 자리","venue":"보안여관","location":"서울, 한국","status":"past","titleEn":"Where Do You Belong To","venueEn":"BOAN 1942","locationEn":"Seoul, Korea"},{"date":"2017","title":"어딘가에, 아무곳도 아닌","venue":"오뉴월 이주원","location":"서울, 한국","status":"past","titleEn":"Somewhere, Nowhere","venueEn":"Oneuwol Ijuwon","locationEn":"Seoul, Korea"},{"date":"2014","title":"과거를 잊은 도시: 기억되지도, 잊히지도 않는","venue":"코너 아트스페이스","location":"서울, 한국","status":"past","titleEn":"A City That Forgot Its Past: Neither Remembered Nor Forgotten","venueEn":"Corner Art Space","locationEn":"Seoul, Korea"},{"date":"2013","title":"동네스토리닷컴2","venue":"스페이스 오뉴월","location":"서울, 한국","status":"past","titleEn":"NeighborhoodStory.com 2","venueEn":"Space Oneuwol","locationEn":"Seoul, Korea"},{"date":"2012","title":"동네스토리닷컴","venue":"스페이스 오뉴월","location":"서울, 한국","status":"past","titleEn":"NeighborhoodStory.com","venueEn":"Space Oneuwol","locationEn":"Seoul, Korea"},{"date":"2010","title":"Letters from Griffintown","venue":"Auberge Alternative Arts Centre","location":"몬트리올, 퀘벡, 캐나다","status":"past"}]};

  const TR_HANGUL = /[가-힣]/;

  function trWords(str) {

      .replace(/(\d+)\s*채널/g, (m, n) => (TR_NUM[+n] || n) + '-channel')
      .replace(/(\d+)\s*개의\s*/g, (m, n) => (TR_NUM[+n] || n) + ' ')

  /* "캔버스 위에 아크릴 물감" → "acrylic paint on canvas" 처럼 어순을 바꿉니다. */
  function trSegment(seg) {
    const on = seg.match(/^(.+?)\s*위에\s*(.+)$/);
    if (on) return trWords(on[2]) + ' on ' + trWords(on[1]);
    return trWords(seg);
  }

  function autoTranslate(src) {
    let s = String(src == null ? '' : src).trim();
    if (!s || !TR_HANGUL.test(s)) return s;
    s = s.replace(/\(?\s*([^(),]+?)\s*(?:과|와)\s*협업\s*\)?/g,
                  (m, who) => '(in collaboration with ' + trWords(who) + ')');
    s = s.replace(/참조\s*:/g, 'after:');
    const out = s.split(/\s*,\s*/).map(trSegment).filter(Boolean).join(', ');
    return out.charAt(0).toUpperCase() + out.slice(1);
  }

  /* 한→영 사전을 뒤집어 영→한 사전을 만듭니다 (먼저 등록된 표기를 우선) */
  const TR_REV = (function () {
    const r = {};
    for (const k in TR_DICT) {
      const v = String(TR_DICT[k]).toLowerCase();
      if (!(v in r)) r[v] = k;
    }
    for (const k in TR_EN_EXTRA) r[k.toLowerCase()] = TR_EN_EXTRA[k];
    Object.keys(r).forEach(k => { if (!(k + 's' in r)) r[k + 's'] = r[k]; });   // 복수형
    return r;
  })();
  const TR_REV_RE = new RegExp(
    '\\b(?:' + Object.keys(TR_REV).sort((a, b) => b.length - a.length)
      .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\b', 'gi');

  /* "Acrylic paint, thread, pins on canvas" → "캔버스 위에 아크릴 물감, 실, 침핀"

  function autoTranslateToKo(src) {
    const s = String(src == null ? '' : src).trim();
    if (!s || TR_HANGUL.test(s)) return s;
    let base = '';
    const out = s.split(/\s*,\s*/).map(seg => {
      const on = seg.match(/^(.+?)\s+on\s+(.+)$/i);
      if (on) {
        if (!base) base = enWords(on[2].replace(/^(?:a|an|the)\s+/i, ''));
        return enWords(on[1]);
      }
      return enWords(seg);
    }).filter(Boolean).join(', ');
    return base ? base + ' 위에 ' + out : out;
  }

    if (v && TR_FIELDS[field] && !TR_HANGUL.test(v)) return autoTranslateToKo(v);

    return (C.works || []).find(w =>
      (norm(w.title) === norm(q.title) || norm(w.titleEn) === norm(q.title)) &&
      (!q.category || w.category === q.category) &&
      (!q.year || String(w.year) === String(q.year))
    ) || null;
  }
  function firstStill(w) {
    return w ? (getImages(w).find(u => u && !isYT(u)) || '') : '';
  }

  function renderGate() {
    const gate = document.getElementById('gate');
    if (!gate) return;
    const a = C.artist || {};

    /* 1) 설정된 첫 화면 작품 → 2) 가장 최근 작품(이미지가 있는 첫 작품) → 3) heroBgImage */
    let art = '';
    const hw = findWork(OPT.heroWork);
    if (hw && firstStill(hw)) { _gateWork = hw; art = firstStill(hw); }
    if (!art) {
      const works = [...(C.works || [])].sort((x, y) => yearNum(y) - yearNum(x));
      for (const w of works) {
        const src = firstStill(w);
        if (src) { art = src; _gateWork = w; break; }
      }
    }
    if (!art && a.heroBgImage) art = a.heroBgImage;

    const bg = document.getElementById('gateBg');
    if (art) {
      bg.style.setProperty('--gate-art', 'url("' + art + '")');
      const pre = new Image(); pre.src = art;
    }
    gateTexts();
    mountHeroVideo();

    /* 아래 버튼 → 작품으로 부드럽게 이동 */
    const btn = document.getElementById('gateEnter');
    if (btn) btn.addEventListener('click', () => {
      const t = document.getElementById('portfolio');
      if (window.__goToSection) window.__goToSection(t); else t.scrollIntoView({ behavior: 'smooth' });
    });
  }

  /* 첫 화면 배경 영상 — 움직임 줄이기 설정 / 데이터 절약 모드에서는 사진만 */
  function mountHeroVideo() {
    const box = document.getElementById('gateVideo');
    const src = (OPT.heroVideo || '').trim();
    if (!box || !src) return;
    try {
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (navigator.connection && navigator.connection.saveData) return;
    } catch (e) {}

    if (isYT(src)) {
      const id = ytId(src);
      /* loop/playlist 를 쓰면 유튜브가 좌우 화살표(이전·다음)를 띄우므로
         반복은 아래에서 직접 처음으로 되감아 처리 */
      const q = 'autoplay=1&mute=1' +
                '&controls=0&playsinline=1&rel=0&modestbranding=1&disablekb=1&iv_load_policy=3&fs=0' +
                '&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
      const f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?' + q;
      f.allow = 'autoplay; encrypted-media';
      f.setAttribute('tabindex', '-1');
      f.title = 'background video';
      box.appendChild(f);

      /* 실제로 재생이 시작됐을 때만 영상을 보여줌.
         자동재생이 막히면(재생 버튼·제목이 뜨는 상태) 영상은 숨기고 작품 사진을 그대로 둔다. */
      let showTimer = null, heard = false, handshake = null, lastState = null, bufTimer = null, rewinding = false;
      const send = obj => { try { f.contentWindow.postMessage(JSON.stringify(obj), '*'); } catch (e) {} };
      const reveal = delay => {
        if (showTimer || box.classList.contains('show')) return;
        showTimer = setTimeout(() => box.classList.add('show'), delay);
      };
      window.addEventListener('message', e => {
        let host = '';
        try { host = new URL(e.origin).hostname; } catch (err) { return; }
        if (!/youtube(-nocookie)?\.com$/.test(host)) return;
        let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
        if (!d) return;
        if (!heard) {                         // 플레이어와 연결됨
          heard = true;
          clearInterval(handshake);
          /* 자동재생이 이미 되고 있으면 아무 명령도 보내지 않음
             (재생 명령을 보내면 유튜브가 화면 가운데에 ❚❚/▶ 표시를 띄워 이름과 겹침).
             0.8초 뒤에도 재생 중이 아닐 때만 한 번 재생을 요청 (그 표시는 영상이 숨겨진 동안 지나감) */
          setTimeout(() => {
            if (lastState !== 1) {
              send({ event: 'command', func: 'mute', args: [] });
              send({ event: 'command', func: 'playVideo', args: [] });
            }
          }, 800);
        }
        const st = d.info && typeof d.info.playerState === 'number' ? d.info.playerState
                 : (d.event === 'onStateChange' ? d.info : null);
        /* 유튜브는 재생·멈춤·로딩 때 화면 가운데에 ▶ / ❚❚ / 로딩 표시를 잠깐 띄운다.
           이 표시는 유튜브 화면 안에 그려져서 직접 지울 수 없으므로,
           표시가 뜰 수 있는 순간에는 영상을 숨기고(작품 사진이 보임) 표시가 사라진 뒤에만 보여준다. */
        const hide = () => { clearTimeout(showTimer); showTimer = null; box.classList.remove('show'); };
        /* 끝나기 직전 : 영상을 먼저 사진으로 되돌린 뒤 처음으로 되감기 → 끝 화면·로딩 표시가 안 보임 */
        if (d.info && typeof d.info.currentTime === 'number' && typeof d.info.duration === 'number' &&
            d.info.duration > 3 && d.info.currentTime > d.info.duration - 1.2 && !rewinding) {
          rewinding = true; hide();
          setTimeout(() => send({ event: 'command', func: 'seekTo', args: [0, true] }), 900);
        } else if (rewinding && d.info && typeof d.info.currentTime === 'number' && d.info.currentTime < 2) {
          rewinding = false;                  // 되감기 완료
        }
        if (st !== null) lastState = st;
        if (st === 0) {                       // 혹시 끝까지 가면 숨기고 처음부터
          hide();
          send({ event: 'command', func: 'seekTo', args: [0, true] });
          send({ event: 'command', func: 'playVideo', args: [] });
          return;
        }
        if (st === 1) {
          clearTimeout(bufTimer);
          reveal(1400);                       // 재생이 안정된 뒤(가운데 표시가 사라진 뒤) 표시
        } else if (st === 3) {                // 로딩이 길어지면 로딩 표시가 보이기 전에 숨김
          clearTimeout(bufTimer);
          bufTimer = setTimeout(() => { if (lastState === 3) hide(); }, 400);
        } else if (st === 2 || st === 5 || st === -1) {
          hide();
        }
      });
      /* 유튜브 플레이어가 준비될 때까지 연결 신호를 반복해서 보냄
         (한 번만 보내면 플레이어가 준비되기 전에 사라져 영상이 끝내 안 나올 수 있음) */
      f.addEventListener('load', () => {
        let tries = 0;
        clearInterval(handshake);
        handshake = setInterval(() => {
          if (heard || ++tries > 40) return clearInterval(handshake);
          send({ event: 'listening', id: 1, channel: 'widget' });
        }, 250);
        /* 끝내 연결 신호를 못 받으면(차단된 환경 등) 6초 뒤 그냥 영상을 보여줌 */
        setTimeout(() => { if (!heard) reveal(0); }, 6000);   // 연결 자체가 안 될 때만
      });
    } else {
      const v = document.createElement('video');
      v.src = src; v.muted = true; v.loop = true; v.autoplay = true;
      v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
      v.addEventListener('playing', () => box.classList.add('show'), { once: true });
      box.appendChild(v);
      const p = v.play(); if (p && p.catch) p.catch(() => {});
    }
  }

  /* ── CV ── */
  function renderCV() {
    const box = document.getElementById('cvContainer');
    box.innerHTML = '';
    (C.cv || []).forEach(group => {
      const entries = (group.entries || []).map(e => `
