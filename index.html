<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="naver-site-verification" content="a78f21ebafd37b047b2a79e4f9a48257a4e76640" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Younghwan Choi (최영환) — Visual Artist based in Seoul, Korea. Works across painting, installation, and video." />
  <title>Younghwan Choi · 최영환</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500&family=Noto+Serif+KR:wght@200;300&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }
    :root {
      --ink: #1a1a18;
      --ink-soft: #6f6d67;
      --line: #ded9d1;
      --line-soft: #ebe7e0;
      --paper: #f6f4ef;
      --paper-2: #efece5;
      --white: #ffffff;
      /* 제목 계열은 명조 (Noto Serif KR), 본문은 고딕 */
      --serif: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
      --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-serif: var(--serif);
      --font-sans: var(--sans);
      --pad: 56px;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--ink); color: var(--paper); }
    img { max-width: 100%; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(246,244,239,0.88);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--pad);
      height: 64px;
      border-bottom: 1px solid transparent;
      transition: border-color .3s;
    }
    nav.scrolled { border-bottom-color: var(--line); }
    .nav-name {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--ink);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-links { display: flex; align-items: center; gap: 30px; list-style: none; }
    .nav-links a {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding-bottom: 3px;
      border-bottom: 1px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .nav-links a:hover, .nav-links a.on { color: var(--ink); border-bottom-color: var(--ink); }

    /* 언어 전환 */
    .nav-lang { display: flex; align-items: center; gap: 8px; margin-left: 6px; }
    .lang-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--sans);
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.14em;
      color: #b0aba2;
      padding: 3px 2px;
      transition: color .2s;
    }
    .lang-btn:hover { color: var(--ink); }
    .lang-btn.active { color: var(--ink); }
    .nav-lang .lang-btn + .lang-btn { border-left: 1px solid var(--line); padding-left: 10px; }

    /* ── Side Nav ── */
    .side-nav {
      position: fixed; right: 26px; top: 50%;
      transform: translateY(-50%);
      z-index: 90;
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 14px;
    }
    .side-nav a { display: flex; flex-direction: row-reverse; align-items: center; gap: 10px; }
    .side-nav .sn-num {
      font-size: 9px; letter-spacing: 0.14em;
      color: #b6b1a8;
      transition: color .25s;
    }
    .side-nav .sn-label {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0; transform: translateX(6px);
      transition: opacity .25s, transform .25s, color .25s;
    }
    .side-nav a:hover .sn-label { opacity: 1; transform: none; }
    .side-nav a:hover .sn-num { color: var(--ink); }
    .side-nav a.active .sn-num { color: var(--ink); }
    .side-nav a.active .sn-label { opacity: 1; transform: none; color: var(--ink); }
    .sn-top {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: row-reverse; align-items: center; gap: 10px;
      margin-bottom: 8px; padding: 0;
      font-family: var(--sans);
    }
    .sn-top-icon { font-size: 12px; color: #b6b1a8; transition: color .25s; }
    .sn-top-label {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0; transform: translateX(6px);
      transition: opacity .25s, transform .25s;
    }
    .sn-top:hover .sn-top-icon { color: var(--ink); }
    .sn-top:hover .sn-top-label { opacity: 1; transform: none; }

    /* ── Layout ── */
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 var(--pad); }
    section { padding: 110px 0; }
    .rule { height: 1px; background: var(--line-soft); max-width: 1180px; margin: 0 auto; }

    /* 대문 다음 바로 포트폴리오 */
    #portfolio { padding-top: 132px; }

    /* ── Intro (미사용 · 마크업 복구 시 대비) ── */
    #top { padding: 0; }
    #intro { padding-top: 152px; padding-bottom: 92px; }
    .intro-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 64px;
      align-items: end;
    }
    .hero-label {
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 26px;
    }
    .hero-name {
      font-family: var(--serif);
      font-weight: 200;
      font-size: clamp(38px, 5.4vw, 68px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .hero-name .name-en {
      display: block;
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(11px, 1.3vw, 15px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-top: 20px;
    }
    .hero-bio {
      font-size: 15px;
      color: var(--ink-soft);
      line-height: 2;
      max-width: 460px;
      border-left: 1px solid var(--line);
      padding-left: 28px;
    }

    /* ── Section header ── */
    .section-header {
      display: flex; align-items: baseline; gap: 18px;
      margin-bottom: 50px;
    }
    .section-num { font-size: 10px; letter-spacing: 0.2em; color: var(--ink-soft); }
    .section-title {
      font-family: var(--serif);
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 200;
      letter-spacing: -0.01em;
    }
    .section-title small {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-left: 14px;
      vertical-align: middle;
    }

    /* ── Works ── */
    .gallery-filter { display: flex; gap: 9px; margin-bottom: 52px; flex-wrap: wrap; }
    .filter-btn {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      color: var(--ink-soft);
      padding: 7px 17px;
      transition: all .2s;
    }
    .filter-btn:hover { border-color: var(--ink-soft); color: var(--ink); }
    .filter-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

    .gallery-group { margin-bottom: 84px; }
    .gallery-group:last-child { margin-bottom: 0; }
    .gallery-group-h {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      padding-bottom: 14px;
      margin-bottom: 34px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: baseline; gap: 10px;
    }
    .gallery-group-h .g-count {
      font-size: 10px; letter-spacing: 0.08em;
      color: var(--ink-soft);
    }
    .gallery-grid-inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 36px 26px;
    }
    .gallery-item { cursor: pointer; }
    .g-frame {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--paper-2);
    }
    .g-frame::after {
      content: '';
      position: absolute; inset: 0;
      border: 1px solid rgba(0,0,0,0.06);
      pointer-events: none;
    }
    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .8s cubic-bezier(.2,.7,.3,1);
    }
    .gallery-item:hover img { transform: scale(1.04); }
    .g-view {
      position: absolute; left: 0; bottom: 0;
      background: var(--ink); color: var(--paper);
      font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      padding: 8px 14px;
      opacity: 0; transform: translateY(6px);
      transition: opacity .3s, transform .3s;
    }
    .gallery-item:hover .g-view { opacity: 1; transform: translateY(0); }
    .g-count-badge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(20,19,17,0.72);
      color: #f6f4ef;
      font-size: 10px; letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .g-meta {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 14px; margin-top: 14px;
    }
    .g-title { font-size: 15px; font-weight: 300; letter-spacing: -0.01em; line-height: 1.5; }
    .g-year { font-size: 11px; letter-spacing: 0.1em; color: var(--ink-soft); white-space: nowrap; }
    .g-desc {
      font-size: 12px; color: var(--ink-soft); line-height: 1.65;
      margin-top: 5px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .yt-play-icon {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(20,19,17,0.6);
      color: #fff; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      padding-left: 3px;
      transition: background .25s;
      pointer-events: none;
    }
    .gallery-item:hover .yt-play-icon { background: rgba(20,19,17,0.82); }
    .gallery-item.ph-1 .g-frame { background: linear-gradient(160deg,#ded8d0,#cdc6bd); }
    .gallery-item.ph-2 .g-frame { background: linear-gradient(160deg,#d3d7dc,#c2c7ce); }
    .gallery-item.ph-3 .g-frame { background: linear-gradient(160deg,#dfd2cf,#cec0bc); }
    .gallery-item.ph-4 .g-frame { background: linear-gradient(160deg,#d0d9d3,#bfc9c2); }
    .gallery-item.ph-5 .g-frame { background: linear-gradient(160deg,#dedbcd,#ccc8b9); }
    .gallery-item.ph-6 .g-frame { background: linear-gradient(160deg,#d3cfda,#c1bcc9); }
    .gallery-empty { color: var(--ink-soft); font-size: 14px; padding: 20px 0; }

    /* ── CV ── */
    .cv-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 40px;
      padding: 32px 0;
      border-top: 1px solid var(--line-soft);
    }
    .cv-grid:last-child { border-bottom: 1px solid var(--line-soft); }
    .cv-category {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      position: sticky; top: 96px;
      align-self: start;
    }
    .cv-entries { }
    .cv-entry {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 20px;
      padding: 10px 0;
    }
    .cv-entry:last-child { padding-bottom: 0; }
    .cv-year { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; padding-top: 3px; }
    .cv-title { font-size: 15px; font-weight: 300; }
    .cv-detail { font-size: 13px; color: var(--ink-soft); margin-top: 1px; }

    /* ── Exhibitions ── */
    .exhibition-list { display: flex; flex-direction: column; }
    .exhibition-item {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      align-items: start;
      gap: 36px;
      padding: 28px 0;
      border-top: 1px solid var(--line-soft);
    }
    .exhibition-item:last-child { border-bottom: 1px solid var(--line-soft); }
    .exhibition-item.is-current { background: var(--paper-2); padding-left: 24px; padding-right: 24px; }
    .ex-date { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; padding-top: 6px; }
    .ex-title { font-family: var(--serif); font-size: 20px; font-weight: 300; margin-bottom: 5px; letter-spacing: -0.01em; }
    .ex-venue { font-size: 13.5px; color: var(--ink); }
    .ex-location { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
    .ex-badge {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
      margin-top: 6px;
    }
    .ex-badge.current { background: var(--ink); color: var(--paper); }
    .ex-badge.upcoming { background: transparent; border: 1px solid var(--ink); color: var(--ink); }
    .ex-badge.past { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }

    /* ── Contact ── */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 88px;
      align-items: start;
    }
    .contact-text {
      font-family: var(--serif);
      font-size: clamp(21px, 2.3vw, 29px);
      font-weight: 200;
      line-height: 1.55;
      margin-bottom: 38px;
    }
    .contact-links { display: flex; flex-direction: column; }
    .contact-link {
      display: flex; align-items: center; gap: 20px;
      color: var(--ink);
      font-size: 14px;
      padding: 14px 0;
      border-top: 1px solid var(--line-soft);
    }
    .contact-links .contact-link:last-child { border-bottom: 1px solid var(--line-soft); }
    .contact-link-label {
      width: 90px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .contact-link-val { border-bottom: 1px solid transparent; transition: border-color .2s; }
    .contact-link:hover .contact-link-val { border-color: var(--ink); }

    .contact-form { display: flex; flex-direction: column; gap: 22px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .form-group input,
    .form-group textarea {
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 11px 0;
      font-size: 14px;
      font-family: var(--sans);
      font-weight: 300;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
      resize: none;
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color: #b6b1a8; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--ink); }
    .form-group textarea { min-height: 96px; }
    .btn-submit {
      align-self: flex-start;
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
      padding: 13px 34px;
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .btn-submit:hover { background: transparent; color: var(--ink); }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--line);
      padding: 36px var(--pad);
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .footer-name { font-family: var(--serif); font-size: 14px; letter-spacing: 0.04em; }
    .footer-copy { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; }

    /* ── Modal ── */
    .modal-bg {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(20,19,17,0.95);
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal-wrap { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; }
    .modal-inner { position: relative; max-width: 1000px; width: 88%; }
    .modal-img { width: 100%; max-height: 76vh; object-fit: contain; display: block; margin: 0 auto; }
    .modal-video-wrap { position: relative; width: 100%; padding-top: 56.25%; }
    .modal-video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .modal-ph {
      background: #2a2825; width: 100%; aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      color: #6b6862; font-size: 11px; letter-spacing: 0.24em;
    }
    .modal-caption {
      color: rgba(246,244,239,0.72);
      font-size: 12.5px;
      letter-spacing: 0.03em;
      line-height: 1.7;
      margin-top: 16px;
      text-align: center;
    }
    .modal-close {
      position: fixed; top: 26px; right: 32px;
      background: none; border: none;
      color: rgba(246,244,239,0.7); font-size: 30px; cursor: pointer; line-height: 1;
      transition: color .2s;
      z-index: 210;
    }
    .modal-close:hover { color: #fff; }
    .modal-arrow {
      position: absolute; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(246,244,239,0.6);
      font-size: 26px; cursor: pointer;
      padding: 16px;
      transition: color .2s;
      z-index: 205;
    }
    .modal-arrow:hover { color: #fff; }
    .modal-arrow-prev { left: -58px; }
    .modal-arrow-next { right: -58px; }
    .modal-arrow.hidden { display: none; }
    .modal-dots { display: flex; justify-content: center; gap: 7px; margin-top: 18px; }
    .modal-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(246,244,239,0.3);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .modal-dot.active { background: rgba(246,244,239,0.95); transform: scale(1.2); }

    /* ── Gate (대문) ── */
    body.gate-open { overflow: hidden; }
    #gate {
      position: fixed; inset: 0; z-index: 500;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer;
      background: #171614;
      overflow: hidden;
      transition: opacity .9s ease, visibility .9s;
    }
    #gate.closing { opacity: 0; visibility: hidden; }
    .gate-bg {
      position: absolute; inset: 0;
      background-color: var(--gate-tint, #b9b2a8);
      background-image: var(--gate-art, none);
      background-size: cover;
      background-position: center;
      animation: gateZoom 10s ease-out forwards;
    }
    @keyframes gateZoom { from { transform: scale(1.10); } to { transform: scale(1.0); } }
    .gate-veil {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(15,14,13,0.44), rgba(15,14,13,0.16) 38%, rgba(15,14,13,0.64));
    }
    .gate-inner {
      position: relative; z-index: 2;
      text-align: center;
      color: #f6f4ef;
      padding: 0 24px;
      animation: gateIn 1.4s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes gateIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .gate-label {
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(246,244,239,0.72);
      margin-bottom: 26px;
    }
    .gate-name-ko {
      font-family: var(--serif);
      font-weight: 200;
      font-size: clamp(44px, 8vw, 104px);
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    }
    .gate-name-en {
      display: block;
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(11px, 1.3vw, 15px);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(246,244,239,0.82);
      margin-top: 22px;
      padding-left: 0.4em;
    }
    .gate-work {
      position: absolute; left: 0; right: 0; bottom: 84px;
      z-index: 2; text-align: center;
      font-size: 11px; letter-spacing: 0.12em;
      color: rgba(246,244,239,0.6);
      padding: 0 24px;
      animation: gateIn 1.8s cubic-bezier(.2,.7,.3,1) both;
    }
    .gate-enter {
      position: absolute; left: 0; right: 0; bottom: 40px;
      z-index: 2; text-align: center;
      font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(246,244,239,0.85);
      animation: gatePulse 2.6s ease-in-out infinite;
    }
    @keyframes gatePulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

    /* ── Reveal ── */
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.in { opacity: 1; transform: none; }

    /* ── Responsive ── */

<script>
  let C = window.SITE_CONTENT || { artist:{}, cv:[], works:[], exhibitions:[] };
  let lang = 'ko';

  /* 미리보기 모드 */
  if (location.search.indexOf('preview') !== -1) {
    try {
      const draft = JSON.parse(localStorage.getItem('SITE_PREVIEW') || 'null');
      if (draft) {
        C = draft;
        const banner = document.createElement('div');
        banner.textContent = '미리보기 모드 · 아직 저장(다운로드)되지 않은 편집 내용입니다';
        banner.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:300;'
          + 'background:#111;color:#fff;font-size:12px;letter-spacing:0.04em;'
          + 'text-align:center;padding:9px 12px;';
        document.body.appendChild(banner);
      }
    } catch(e) {}
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function nl2br(s) { return esc(s).replace(/\n/g,'<br>'); }

  // 언어에 따라 필드 선택
  function t(obj, field) {
    return (lang === 'en' && obj[field + 'En']) ? obj[field + 'En'] : (obj[field] || '');
  }

  /* ── 언어 전환 ── */
  function setLang(l) {
    lang = l;
    document.getElementById('btnKo').classList.toggle('active', l === 'ko');
    document.getElementById('btnEn').classList.toggle('active', l === 'en');

    // 정적 HTML 요소 전환
    const isEn = l === 'en';
    const el = id => document.getElementById(id);
    if (el('heroCta'))   el('heroCta').textContent   = isEn ? 'View Works →' : '작품 보기 →';
    if (el('labelName')) el('labelName').textContent = isEn ? 'Name' : '이름 / Name';
    if (el('labelEmail'))el('labelEmail').textContent= isEn ? 'Email' : '이메일 / Email';
    if (el('labelMsg'))  el('labelMsg').textContent  = isEn ? 'Message' : '메시지 / Message';
    if (el('inputMsg'))  el('inputMsg').placeholder  = isEn ? 'Please enter your message.' : '문의 내용을 입력해 주세요.';
    if (el('inputName')) el('inputName').placeholder = isEn ? 'Your name' : '성함을 입력해 주세요.';

    if (el('secWorks'))   el('secWorks').textContent   = isEn ? 'Portfolio' : '포트폴리오';
    if (el('secCv'))      el('secCv').textContent      = isEn ? 'Curriculum Vitae' : '약력';
    if (el('secEx'))      el('secEx').textContent      = isEn ? 'News' : '전시 소식';
    if (el('secContact')) el('secContact').textContent = isEn ? 'Get in touch' : '문의';

    renderArtist();
    renderCV();
    renderWorks();
    renderExhibitions();
    if (document.getElementById('gate')) gateTexts();
  }

  /* ── 작가 정보 ── */
  function renderArtist() {
    const a = C.artist || {};
    document.getElementById('navName').textContent    = lang === 'en' ? (a.nameEn||a.nameKo||'') : (a.nameKo||a.nameEn||'');
    const set = (id, val, html) => {
      const n = document.getElementById(id);
      if (!n) return;                 // 인트로 섹션을 쓰지 않을 때
      if (html) n.innerHTML = val; else n.textContent = val;
    };
    set('heroLabel',  a.label || '');
    set('heroNameKo', a.nameKo || '');
    set('heroNameEn', a.nameEn || '');
    set('heroBio',    nl2br(t(a, 'bio')), true);
    document.getElementById('contactText').innerHTML  = nl2br(t(a, 'contactText'));
    document.title = (a.nameEn || a.nameKo || 'Artist') + ' · ' + (a.nameEn || '');

    const links = document.getElementById('contactLinks');
    links.innerHTML = '';
    if (a.email) {
      links.innerHTML += `<a class="contact-link" href="mailto:${esc(a.email)}">
        <span class="contact-link-label">Email</span>
        <span class="contact-link-val">${esc(a.email)}</span></a>`;
    }
    if (a.instagram) {
      links.innerHTML += `<a class="contact-link" href="${esc(a.instagramUrl||'#')}" target="_blank" rel="noopener">
        <span class="contact-link-label">Instagram</span>
        <span class="contact-link-val">${esc(a.instagram)}</span></a>`;
    }
    document.getElementById('footerName').textContent = [a.nameKo, a.nameEn].filter(Boolean).join(' · ');
    document.getElementById('footerCopy').textContent = t(a, 'footer');
  }

  /* ── 연도 파싱 : "2012-2013", "2020 –" 등에서 가장 늦은 연도 ── */
  function yearNum(w) {
    const ms = String((w && w.year) || '').match(/\d{4}/g);
    return ms ? Math.max(...ms.map(Number)) : 0;
  }

  /* ── Gate (대문) : 가장 최근 작품 이미지 전체화면 ── */
  function gateTexts() {
    const a = C.artist || {};
    document.getElementById('gateLabel').textContent  = a.label || '';
    document.getElementById('gateNameKo').textContent = lang === 'en' ? (a.nameEn || a.nameKo || '') : (a.nameKo || a.nameEn || '');
    document.getElementById('gateNameEn').textContent = lang === 'en' ? '' : (a.nameEn || '');
    const w = _gateWork;
    if (w) {
      document.getElementById('gateWork').textContent =
        [t(w, 'title'), w.year].filter(Boolean).join(', ');
    }
  }

  let _gateWork = null;
  function renderGate() {
    const gate = document.getElementById('gate');
    if (!gate) return;
    const a = C.artist || {};

    /* 가장 최근 작품(연도 내림차순) 중 이미지가 있는 첫 작품 */
    const works = [...(C.works || [])].sort((x, y) => yearNum(y) - yearNum(x));
    let art = '';
    for (const w of works) {
      const imgs = getImages(w);
      const src = imgs.find(u => u && !isYT(u));
      if (src) { art = src; _gateWork = w; break; }
    }
    /* 작품 이미지가 하나도 없으면 artist.heroBgImage 사용 */
    if (!art && a.heroBgImage) art = a.heroBgImage;

    const bg = document.getElementById('gateBg');
    if (art) {
      bg.style.setProperty('--gate-art', 'url("' + art + '")');
      const pre = new Image(); pre.src = art;
    }
    gateTexts();

    let closed = false;
    function enter() {
      if (closed) return;
      closed = true;
      gate.classList.add('closing');
      document.body.classList.remove('gate-open');
      setTimeout(() => { if (gate.parentNode) gate.remove(); }, 950);
    }
    gate.addEventListener('click', enter);
    gate.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') enter(); });
    gate.addEventListener('wheel', enter, { passive: true });
    gate.addEventListener('touchmove', enter, { passive: true });
    try { gate.focus({ preventScroll: true }); } catch (e) {}
  }

  /* ── CV ── */
  function renderCV() {
    const box = document.getElementById('cvContainer');
    box.innerHTML = '';
    (C.cv || []).forEach(group => {
      const entries = (group.entries || []).map(e => `
        <div class="cv-entry">
          <span class="cv-year">${esc(e.year)}</span>
          <div class="cv-content">
            <div class="cv-title">${esc(t(e,'title'))}</div>
            ${t(e,'detail') ? `<div class="cv-detail">${esc(t(e,'detail'))}</div>` : ''}
          </div>
        </div>`).join('');
      box.innerHTML += `
        <div class="cv-grid reveal">
          <div class="cv-category">${esc(group.category)}</div>
          <div class="cv-entries">${entries}</div>
        </div>`;
    });
  }

  /* ── Works ── */
  /* 매체 표시 이름 */
  const CAT_LABEL = {
    painting: 'Painting', installation: 'Installation', collage: 'Collage', photography: 'Photography', community: 'Community · Public Art',
    video: 'Video', photography: 'Photography',
    performance: 'Performance', printmaking: 'Printmaking', sculpture: 'Sculpture'
  };
  function catLabel(c) { return CAT_LABEL[c] || (c ? c.charAt(0).toUpperCase()+c.slice(1) : 'Other'); }

  let _activeFilter = 'all';

  function renderWorks() {
    const grid = document.getElementById('galleryGrid');
    const filterBar = document.getElementById('galleryFilter');
    grid.innerHTML = '';

    const works = [...(C.works || [])].sort((a, b) => yearNum(b) - yearNum(a));
    if (!works.length) { grid.innerHTML = '<p class="gallery-empty">No works registered.</p>'; return; }

    // 고정 메뉴 4개: Installation / Video / Drawing / Painting
    const MENU = [
      { key: 'all',          label: 'All' },
      { key: 'installation', label: 'Installation' },
      { key: 'video',        label: 'Video' },
      { key: 'photography',  label: 'Photography' },
      { key: 'community',    label: 'Community · Public Art' },
      { key: 'painting',     label: 'Painting' },
      { key: 'collage',      label: 'Collage' },
    ];
    filterBar.innerHTML = '';
    MENU.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (_activeFilter === m.key ? ' active' : '');
      btn.dataset.filter = m.key;
      btn.textContent = m.label;
      filterBar.appendChild(btn);
    });
    wireFilter();

    // 카테고리 표시 순서 (그 외는 뒤로)
    const CAT_ORDER = ['installation','video','collage','photography','community','painting'];
    function catRank(c){ const i = CAT_ORDER.indexOf(c); return i === -1 ? CAT_ORDER.length : i; }

    function buildItem(w, i) {
      const item = document.createElement('div');
      const thumbRaw = getThumb(w);
      const thumbSrc = thumbRaw ? (isYT(thumbRaw) ? ytThumb(thumbRaw) : thumbRaw) : '';
      const isYTThumb = thumbRaw && isYT(thumbRaw);
      item.className = 'gallery-item' + (thumbSrc ? '' : ' ph-' + ((i % 6) + 1));
      item.dataset.cat = w.category || '';
      const nImg = getImages(w).length;
      item.innerHTML =
        '<div class="g-frame">' +
        (thumbSrc ? `<img src="${esc(thumbSrc)}" alt="${esc(t(w,'title'))}" loading="lazy">` : '') +
        (isYTThumb ? `<div class="yt-play-icon">▶</div>` : '') +
        (nImg > 1 ? `<span class="g-count-badge">${nImg}</span>` : '') +
        `<span class="g-view">View</span></div>` +
        `<div class="g-meta">
           <span class="g-title">${esc(t(w,'title'))}</span>
           <span class="g-year">${esc(w.year || '')}</span>
         </div>` +
        (t(w,'desc') ? `<p class="g-desc">${esc(t(w,'desc'))}</p>` : '');
      item.addEventListener('click', () => openModal(w));
      return item;
    }

    // 매체별로 묶어서 섹션 렌더 (전체면 모든 그룹, 필터 시 해당 그룹만)
    const groups = {};
    works.forEach(w => {
      const c = w.category || 'other';
      (groups[c] = groups[c] || []).push(w);
    });
    const cats = Object.keys(groups).sort((a, b) => {
      const r = catRank(a) - catRank(b);
      return r !== 0 ? r : a.localeCompare(b);
    });

    let idx = 0;
    cats.forEach(c => {
      if (_activeFilter !== 'all' && c !== _activeFilter) return;
      const sec = document.createElement('div');
      sec.className = 'gallery-group reveal';
      const h = document.createElement('h3');
      h.className = 'gallery-group-h';
      h.innerHTML = `${esc(catLabel(c))}<span class="g-count">${groups[c].length}</span>`;
      const inner = document.createElement('div');
      inner.className = 'gallery-grid-inner';
      groups[c].forEach(w => { inner.appendChild(buildItem(w, idx++)); });
      sec.appendChild(h);
      sec.appendChild(inner);
      grid.appendChild(sec);
    });
    if (typeof wireReveal === 'function') wireReveal();
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  /* ── Exhibitions ── */
  const STATUS_LABEL = {
    ko: { current:'진행 중', upcoming:'예정', past:'종료' },
    en: { current:'Current', upcoming:'Upcoming', past:'Past' }
  };
  const STATUS_ORDER = { current: 0, upcoming: 1, past: 2 };
  function renderExhibitions() {
    const list = document.getElementById('exhibitionList');
    list.innerHTML = '';
    const items = [...(C.exhibitions || [])].sort((a, b) =>
      (STATUS_ORDER[a.status || 'past'] ?? 3) - (STATUS_ORDER[b.status || 'past'] ?? 3));
    items.forEach(ex => {
      const st  = ex.status || 'past';
      const lbl = (STATUS_LABEL[lang] || STATUS_LABEL.ko)[st] || st;
      list.innerHTML += `
        <div class="exhibition-item reveal${st === 'current' ? ' is-current' : ''}">
          <div class="ex-date">${nl2br(ex.date)}</div>
          <div class="ex-info">
            <div class="ex-title">${esc(t(ex,'title'))}</div>
            <div class="ex-venue">${esc(t(ex,'venue'))}</div>
            ${ex.location ? `<div class="ex-location">${esc(ex.location)}</div>` : ''}
          </div>
          <span class="ex-badge ${esc(st)}">${esc(lbl)}</span>
        </div>`;
    });
  }

  /* ── Modal ── */
  const modal = document.getElementById('modal');
  let _modalWork = null;
  let _modalIdx = 0;

  /* ── YouTube 유틸 ── */
  function ytId(url) {
    if (!url || !url.includes('youtu')) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function isYT(src) { return !!ytId(src); }
  function ytThumb(src) { return `https://img.youtube.com/vi/${ytId(src)}/hqdefault.jpg`; }
  function ytEmbed(src) { return `https://www.youtube.com/embed/${ytId(src)}?autoplay=1&rel=0`; }

  function getImages(w) {
    // 모달용: full 이미지 우선
    if (w.images_full && w.images_full.length) return w.images_full;
    if (w.images && w.images.length) return w.images;
    if (w.image) return [w.image];
    return [];
  }
  function getThumb(w) {
    // 갤러리 썸네일용: thumb 우선
    const src = (w.images_thumb && w.images_thumb[0])
             || (w.images && w.images[0])
             || w.image || '';
    return src;
  }

  function showModalImage(w, idx) {
    _modalWork = w;
    _modalIdx = idx;
    const imgs = getImages(w);
    const content = document.getElementById('modalContent');
    const dots = document.getElementById('modalDots');
    const prev = document.getElementById('modalPrev');
    const next = document.getElementById('modalNext');

    // 이미지 or 유튜브 표시
    if (imgs.length > 0 && imgs[idx]) {
      const src = imgs[idx];
      if (isYT(src)) {
        content.innerHTML = `<div class="modal-video-wrap"><iframe src="${ytEmbed(src)}" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
      } else {
        content.innerHTML = `<img class="modal-img" src="${esc(src)}" alt="${esc(w.title)}">`;
      }
    } else {
      content.innerHTML = `<div class="modal-ph">IMAGE</div>`;
    }

    // 화살표
    prev.classList.toggle('hidden', imgs.length <= 1 || idx === 0);
    next.classList.toggle('hidden', imgs.length <= 1 || idx >= imgs.length - 1);

    // 닷 인디케이터
    dots.innerHTML = '';
    if (imgs.length > 1) {
      imgs.forEach((_, i) => {
        const d = document.createElement('span');
        d.className = 'modal-dot' + (i === idx ? ' active' : '');
        d.onclick = () => showModalImage(w, i);
        dots.appendChild(d);
      });
    }

    // 캡션
    let cap = [t(w,'title'), w.year].filter(Boolean).join(', ');
    if (t(w,'desc')) cap += '  ·  ' + t(w,'desc');
    if (imgs.length > 1) cap += `  (${idx+1}/${imgs.length})`;
    document.getElementById('modalCaption').textContent = cap;
  }

  function openModal(w) {
    showModalImage(w, 0);
    modal.classList.add('open');
  }

  document.getElementById('modalPrev').addEventListener('click', (e) => {
    e.stopPropagation();
    if (_modalWork && _modalIdx > 0) showModalImage(_modalWork, _modalIdx - 1);
  });
  document.getElementById('modalNext').addEventListener('click', (e) => {
    e.stopPropagation();
    if (_modalWork) {
      const imgs = getImages(_modalWork);
      if (_modalIdx < imgs.length - 1) showModalImage(_modalWork, _modalIdx + 1);
    }
  });
  function closeModal() {
    modal.classList.remove('open');
    // iframe autoplay 정지
    const iframe = modal.querySelector('iframe');
    if (iframe) iframe.src = iframe.src;
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft' && _modalWork && _modalIdx > 0) showModalImage(_modalWork, _modalIdx - 1);
    if (e.key === 'ArrowRight' && _modalWork) {
      const imgs = getImages(_modalWork);
      if (_modalIdx < imgs.length - 1) showModalImage(_modalWork, _modalIdx + 1);
    }
  });

  /* ── Gallery Filter ── */
  function wireFilter() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        _activeFilter = btn.dataset.filter;
        renderWorks();
      });
    });
  }

  /* ── Contact Form ── */
  function handleSubmit(e) {
    e.preventDefault();
    const btn = e.target.querySelector('.btn-submit');
    btn.textContent = 'Sent ✓'; btn.style.background = '#555';
    setTimeout(() => { btn.textContent = 'Send →'; btn.style.background = ''; e.target.reset(); }, 2500);
  }

  /* ── Nav active scroll ── */
  function wireScroll() {
    const nav = document.getElementById('nav');
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-links a');
    const sideLinks = document.querySelectorAll('.side-nav a');
    function onScroll() {
      if (nav) nav.classList.toggle('scrolled', window.scrollY > 12);
      let current = '';
      sections.forEach(s => { if (window.scrollY >= s.offsetTop - 120) current = s.id; });
      navLinks.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + current));
      sideLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  /* ── Reveal on scroll ──
     어떤 이유로든 관찰이 실패해도 내용은 반드시 보이도록 안전장치를 둔다 */
  function showAllReveal() {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  }
  function wireReveal() {
    try {
      const els = document.querySelectorAll('.reveal:not(.in)');
      if (!('IntersectionObserver' in window)) { showAllReveal(); return; }
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
      els.forEach(el => io.observe(el));
      setTimeout(showAllReveal, 2500);   // 안전장치
    } catch (e) {
      showAllReveal();
    }
  }

  /* ── Init ── */
  /* 한 단계가 실패해도 나머지 화면은 그려지도록 각각 보호 */
  function run(fn, name) {
    try { fn(); } catch (e) { console.error('[site] ' + name + ' failed:', e); }
  }
  run(renderGate, 'gate');
  run(renderArtist, 'artist');
  run(renderWorks, 'works');
  run(renderCV, 'cv');
  run(renderExhibitions, 'exhibitions');
  run(wireFilter, 'filter');
  run(wireScroll, 'scroll');
  run(wireReveal, 'reveal');
</script>
</body>
</html>
