<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="naver-site-verification" content="a78f21ebafd37b047b2a79e4f9a48257a4e76640" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Younghwan Choi (최영환) — Visual Artist based in Seoul, Korea. Works across painting, installation, and video." />
  <title>Younghwan Choi · 최영환</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }
    :root {
      --black: #0a0a0a;
      --gray: #555555;
      --gray-soft: #777777;
      --light: #e0e0e0;
      --bg: #fafafa;
      --white: #ffffff;
      --font-serif: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-sans:  'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --recent-work: #d4cfc9;
      --hero-bg-image: none;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: var(--black);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--light);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px;
      height: 60px;
    }
    .nav-name {
      font-family: var(--font-serif);
      font-size: 17px;
      letter-spacing: 0.02em;
      color: var(--black);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a {
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--black); }

    /* ── Sections ── */
    section { padding: 100px 48px; max-width: 1100px; margin: 0 auto; }
    #portfolio { max-width: 100%; padding-left: 48px; padding-right: 48px; }
    @media (max-width: 768px) {
      #portfolio { padding-left: 0; padding-right: 0; }
    }
    /* 배경이 비쳐 보이도록 — 각 섹션 콘텐츠는 흰색 반투명 블록으로 처리 */
    #cv, #portfolio, #exhibitions, #contact {
      background: rgba(250,250,250,0.88);
      backdrop-filter: blur(2px);
    }
    section:first-of-type { padding-top: 160px; }

    /* ── Hero ── */
    #hero {
      min-height: 90vh;
      display: flex; flex-direction: column; justify-content: center;
      padding-top: 120px;
      border-bottom: 1px solid var(--light);
      position: relative;
      /* 전체 너비 채우기 */
      max-width: 100%;
      width: 100%;
      margin-left: 0;
      margin-right: 0;
      background-image: var(--hero-bg-image);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
    #hero::before {
      content: '';
      position: absolute; top: 0; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100vw; z-index: -1;
      background: linear-gradient(rgba(10,10,10,0.45), rgba(10,10,10,0.55));
    }
    .hero-label {
      font-size: 11px; letter-spacing: 0.2em;
      text-transform: uppercase; color: rgba(255,255,255,0.75); margin-bottom: 24px;
    }
    .hero-name {
      font-family: var(--font-serif);
      font-size: clamp(30px, 4.5vw, 52px);
      font-weight: 300; line-height: 1.15;
      letter-spacing: -0.02em; margin-bottom: 32px;
      color: #ffffff;
    }
    .hero-name .name-ko,
    .hero-name .name-en { font-size: 1em; line-height: 1.15; }
    .hero-bio {
      font-size: 16px;
      color: rgba(255,255,255,0.85); line-height: 1.8; margin-bottom: 48px;
    }
    .hero-cta {
      display: inline-block;
      font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: #ffffff;
      padding-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,0.5);
      transition: opacity 0.2s;
    }
    .hero-cta:hover { opacity: 0.5; }

    /* ── Section Title ── */
    .section-header {
      display: flex; align-items: baseline; gap: 20px;
      margin-bottom: 60px;
      padding-bottom: 20px;
    }
    .section-title { font-family: var(--font-serif); font-size: 32px; font-weight: 400; }
    .section-num { font-size: 11px; letter-spacing: 0.15em; color: var(--gray); }

    /* ── CV ── */
    .cv-grid { display: grid; grid-template-columns: 180px 1fr; gap: 0; }
    .cv-category {
      font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; color: #666;
      font-weight: 400;
      padding-top: 2px; padding-bottom: 40px;
      line-height: 1.6;
    }
    .cv-entries { padding-bottom: 40px; margin-bottom: 40px; }
    .cv-entry {
      display: grid; grid-template-columns: 80px 1fr;
      gap: 16px; margin-bottom: 20px;
    }
    .cv-entry:last-child { margin-bottom: 0; }
    .cv-year { font-size: 13px; color: #888; padding-top: 1px; font-weight: 300; }
    .cv-title { font-size: 15px; font-weight: 300; color: #222; }
    .cv-detail { font-size: 13px; color: #888; margin-top: 3px; }

    /* ── Gallery ── */
    .gallery-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 48px; }
    .filter-btn {
      font-size: 12px; letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none; border: none; cursor: pointer;
      color: var(--gray); padding: 6px 14px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .filter-btn:hover { color: var(--black); }
    .filter-btn.active { color: var(--black); font-weight: 500; background: #dcdcdc; }
    .gallery-grid { display: block; }
    .gallery-group { margin-bottom: 72px; }
    .gallery-group:last-child { margin-bottom: 0; }
    .gallery-group-h {
      font-family: var(--font-serif);
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--gray); margin: 0 0 24px;
      padding-bottom: 10px; border-bottom: 1px solid var(--light);
    }
    .gallery-group-h .g-count { color: var(--gray-soft); font-weight: 300; margin-left: 10px; }
    .gallery-grid-inner {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    @media (max-width: 1200px) {
      .gallery-grid-inner { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 900px) {
      .gallery-grid-inner { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .gallery-group { margin-bottom: 56px; }
    }
    @media (max-width: 600px) {
      .gallery-grid-inner { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    }
    @media (max-width: 1024px) {    }
    @media (max-width: 768px) {
          }
    .gallery-item {
      position: relative; overflow: hidden;
      aspect-ratio: 1; background: #ece8e1; cursor: pointer;
      border-radius: 3px;
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.6s ease; }
    .gallery-item:hover img { transform: scale(1.04); }
    .gallery-overlay {
      position: absolute; inset: 0;
      background: rgba(17,17,17,0.7);
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 24px; opacity: 0; transition: opacity 0.3s;
    }
    .gallery-item:hover .gallery-overlay { opacity: 1; }
    .gallery-overlay .g-title { color: #fff; font-size: 15px; font-weight: 500; }
    .gallery-overlay .g-year { color: #fff; font-size: 12px; margin-top: 4px; }
    .gallery-item.ph-1 { background: #d4cfc9; }
    .gallery-item.ph-2 { background: #c9cdd4; }
    .gallery-item.ph-3 { background: #d4c9c9; }
    .gallery-item.ph-4 { background: #c9d4cd; }
    .gallery-item.ph-5 { background: #d4d2c9; }
    .gallery-item.ph-6 { background: #cbc9d4; }
    .gallery-empty { color: var(--gray); font-size: 14px; padding: 20px 0; }

    /* ── Exhibitions ── */
    .exhibition-list { display: flex; flex-direction: column; }
    .exhibition-item {
      display: grid; grid-template-columns: 120px 1fr auto;
      align-items: start; gap: 32px;
      padding: 32px 0; border-bottom: 1px solid var(--light);
    }
    .ex-date { font-size: 13px; color: #888; padding-top: 3px; line-height: 1.6; font-weight: 300; }
    .ex-title { font-size: 18px; font-weight: 300; margin-bottom: 6px; color: #222; }
    .ex-venue { font-size: 13px; color: #888; }
    .ex-location { font-size: 12px; color: #999; margin-top: 2px; }
    .ex-badge {
      font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 4px 10px;
      border-radius: 20px; white-space: nowrap; margin-top: 4px;
    }
    .ex-badge.current  { background: #111; color: #fff; }
    .ex-badge.upcoming { background: transparent; border: 1px solid #111; color: #111; }
    .ex-badge.past     { background: var(--light); color: var(--gray); }

    /* ── Contact ── */
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: start;
    }
    .contact-text {
      font-family: var(--font-serif);
      font-size: 28px; font-weight: 300;
      line-height: 1.4; margin-bottom: 40px;
      color: #333;
    }
    .contact-links { display: flex; flex-direction: column; gap: 16px; }
    .contact-link {
      display: flex; align-items: center; gap: 16px;
      text-decoration: none; color: var(--black); font-size: 14px;
    }
    .contact-link-label {
      width: 80px; font-size: 11px;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray);
    }
    .contact-link-val { transition: opacity 0.2s; }
    .contact-link:hover .contact-link-val { opacity: 0.6; }
    .contact-form { display: flex; flex-direction: column; gap: 24px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label {
      font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--gray);
    }
    .form-group input, .form-group textarea {
      border: none; border-bottom: 1px solid var(--light);
      background: transparent; padding: 10px 0;
      font-size: 14px; font-family: var(--font-sans);
      color: var(--black); outline: none;
      transition: border-color 0.2s; resize: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--black); }
    .form-group textarea { min-height: 100px; }
    .btn-submit {
      align-self: flex-start;
      background: var(--black); color: var(--white);
      border: none; padding: 14px 36px;
      font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer;
      font-family: var(--font-sans);
      transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.75; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--light);
      padding: 40px 48px; max-width: 1100px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-name { font-family: var(--font-serif); font-size: 15px; }
    .footer-copy { font-size: 12px; color: var(--gray); }

    /* ── Modal ── */
    .modal-bg {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(10,10,10,0.92);
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal-inner { position: relative; width: 100%; }
    .modal-img { width: 100%; max-height: 80vh; object-fit: contain; display: block; }
    .modal-video-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .modal-video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .yt-play-icon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 52px; height: 52px; background: rgba(0,0,0,0.65); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; pointer-events: none;
    }
    .gallery-item { position: relative; }
    .modal-ph {
      background: #222; width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      color: #555; font-size: 14px; letter-spacing: 0.1em;
    }
    .modal-caption {
      color: rgba(255,255,255,0.7); font-size: 13px;
      margin-top: 16px; text-align: center;
    }
    .modal-wrap {
      position: relative;
      max-width: 860px; width: 90%;
    }
    .modal-close {
      position: absolute; top: -36px; right: 0;
      background: none; border: none;
      color: #fff; font-size: 26px; cursor: pointer; line-height: 1;
      width: 36px; height: 36px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s; z-index: 201; opacity: 0.85;
    }
    .modal-close:hover { opacity: 1; }
    .modal-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; font-size: 20px; cursor: pointer;
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; z-index: 201;
      user-select: none;
    }
    .modal-arrow:hover { background: rgba(255,255,255,0.28); }
    .modal-arrow-prev { left: -70px; }
    .modal-arrow-next { right: -70px; }
    .modal-arrow.hidden { opacity: 0; pointer-events: none; }
    .modal-dots {
      display: flex; justify-content: center; gap: 6px; margin-top: 12px;
    }
    .modal-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.3); cursor: pointer; transition: background 0.2s;
    }
    .modal-dot.active { background: #fff; }
    @media (max-width: 768px) {
      .modal-arrow-prev { left: -54px; }
      .modal-arrow-next { right: -54px; }
      .modal-close { top: 16px; right: 16px; }
    }

    .nav-lang {
      display: flex; gap: 4px; align-items: center; margin-left: 32px;
    }
    .lang-btn {
      background: none; border: none; cursor: pointer;
      font-size: 11px; letter-spacing: 0.1em;
      font-family: var(--font-sans);
      color: var(--gray); padding: 4px 7px;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .lang-btn.active {
      color: var(--black);
      font-weight: 500;
      background: rgba(0,0,0,0.06);
    }
    .lang-btn:hover { color: var(--black); }
    .side-nav {
      position: fixed;
      top: 50%;
      right: 32px;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .sn-top {
      background: none; border: none; cursor: pointer;
      font-family: var(--font-sans);
      display: flex; align-items: center; gap: 14px;
      color: #777; font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 0;
      transition: color 0.25s;
      margin-bottom: 6px;
    }
    .sn-top:hover { color: #222; }
    .sn-top-icon {
      font-size: 13px; line-height: 1;
    }
    .sn-top-label {
      opacity: 0; transform: translateX(-6px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .sn-top:hover .sn-top-label {
      opacity: 1; transform: translateX(0);
    }
    .side-nav a {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #777;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.25s;
    }
    .side-nav .sn-num {
      font-weight: 300;
      width: 18px;
    }
    .side-nav .sn-label {
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .side-nav a:hover { color: #222; }
    .side-nav a:hover .sn-label {
      opacity: 1;
      transform: translateX(0);
    }
    .side-nav a.active { color: #111; }
    .side-nav a.active .sn-num { font-weight: 500; }
    .side-nav a.active .sn-label {
      opacity: 1;
      transform: translateX(0);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      nav { padding: 0 16px; }
      .nav-name { font-size: 13px; letter-spacing: 0.01em; }
      .nav-links { gap: 14px; }
      section { padding: 80px 24px; }
      .cv-grid { grid-template-columns: 1fr; }
      .cv-category { padding-bottom: 8px; }      .exhibition-item { grid-template-columns: 1fr; gap: 8px; }
      .contact-grid { grid-template-columns: 1fr; gap: 48px; }
      footer { flex-direction: column; gap: 8px; text-align: center; }
      .side-nav { display: none; }
    }
    @media (max-width: 1240px) {
      .side-nav { right: 16px; }
    }
    @media (max-width: 480px) {
      .nav-name { font-size: 12px; }
      .nav-links { gap: 10px; }
      .nav-links a { font-size: 11px; letter-spacing: 0.04em; }
      nav { padding: 0 12px; }
    }
  </style>
</head>
<body>

<!-- ── Navigation ── -->
<nav>
  <a class="nav-name" href="#hero" id="navName">최영환</a>
  <ul class="nav-links">
    <li><a href="#cv">CV</a></li>
    <li><a href="#portfolio">Works</a></li>
    <li><a href="#exhibitions">Exhibitions</a></li>
    <li><a href="#contact">Contact</a></li>
    <li class="nav-lang">
      <button class="lang-btn active" id="btnKo" onclick="setLang('ko')">KOR</button>
      <button class="lang-btn"        id="btnEn" onclick="setLang('en')">ENG</button>
    </li>
  </ul>
</nav>

<!-- ── Side Nav (scroll follower) ── -->
<aside class="side-nav">
  <button class="sn-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="sn-top-icon">↑</span>
    <span class="sn-top-label">Top</span>
  </button>
  <a href="#cv"><span class="sn-num">01</span><span class="sn-label">CV</span></a>
  <a href="#portfolio"><span class="sn-num">02</span><span class="sn-label">Works</span></a>
  <a href="#exhibitions"><span class="sn-num">03</span><span class="sn-label">Exhibitions</span></a>
  <a href="#contact"><span class="sn-num">04</span><span class="sn-label">Contact</span></a>
</aside>

<!-- ── Hero ── -->
<section id="hero">
  <p class="hero-label" id="heroLabel"></p>
  <h1 class="hero-name">
    <span class="name-ko" id="heroNameKo"></span><br>
    <span class="name-en" id="heroNameEn"></span>
  </h1>
  <p class="hero-bio" id="heroBio"></p>
  <a class="hero-cta" href="#portfolio" id="heroCta">작품 보기 →</a>
</section>

<!-- ── CV ── -->
<section id="cv">
  <div class="section-header">
    <span class="section-num">01</span>
    <h2 class="section-title">CV</h2>
  </div>
  <div id="cvContainer"></div>
</section>

<!-- ── Portfolio ── -->
<section id="portfolio">
  <div class="section-header">
    <span class="section-num">02</span>
    <h2 class="section-title">Works</h2>
  </div>
  <div class="gallery-filter" id="galleryFilter"></div>
  <div id="galleryGrid" class="gallery-grid"></div>
</section>

<!-- ── Exhibitions ── -->
<section id="exhibitions">
  <div class="section-header">
    <span class="section-num">03</span>
    <h2 class="section-title">Exhibitions</h2>
  </div>
  <div class="exhibition-list" id="exhibitionList"></div>
</section>

<!-- ── Contact ── -->
<section id="contact">
  <div class="section-header">
    <span class="section-num">04</span>
    <h2 class="section-title">Contact</h2>
  </div>
  <div class="contact-grid">
    <div>
      <p class="contact-text" id="contactText"></p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
    <form class="contact-form" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label id="labelName">이름 / Name</label>
        <input type="text" id="inputName" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label id="labelEmail">이메일 / Email</label>
        <input type="email" id="inputEmail" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label id="labelMsg">메시지 / Message</label>
        <textarea id="inputMsg" placeholder="문의 내용을 입력해 주세요."></textarea>
      </div>
      <button type="submit" class="btn-submit">Send →</button>
    </form>
  </div>
</section>

<!-- ── Footer ── -->
<footer>
  <span class="footer-name" id="footerName"></span>
  <span class="footer-copy" id="footerCopy"></span>
</footer>

<!-- ── Modal ── -->
<div class="modal-bg" id="modal">
  <div class="modal-wrap">
  <button class="modal-close" id="modalClose">×</button>
  <div class="modal-inner">
    <button class="modal-arrow modal-arrow-prev hidden" id="modalPrev">&#8592;</button>
    <button class="modal-arrow modal-arrow-next hidden" id="modalNext">&#8594;</button>

  if (location.search.indexOf('preview') !== -1) {
    try {
      const draft = JSON.parse(localStorage.getItem('SITE_PREVIEW') || 'null');
      if (draft) {
        C = draft;
        const banner = document.createElement('div');
        banner.textContent = '미리보기 모드 · 아직 저장(다운로드)되지 않은 편집 내용입니다';
        banner.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:300;'
          + 'background:#111;color:#fff;font-size:12px;letter-spacing:0.04em;'
          + 'text-align:center;padding:9px 12px;';
        document.body.appendChild(banner);
      }
    } catch(e) {}
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function nl2br(s) { return esc(s).replace(/\n/g,'<br>'); }

  // 언어에 따라 필드 선택
  function t(obj, field) {
    return (lang === 'en' && obj[field + 'En']) ? obj[field + 'En'] : (obj[field] || '');
  }

  /* ── 언어 전환 ── */
  function setLang(l) {
    lang = l;
    document.getElementById('btnKo').classList.toggle('active', l === 'ko');
    document.getElementById('btnEn').classList.toggle('active', l === 'en');

    // 정적 HTML 요소 전환
    const isEn = l === 'en';
    const el = id => document.getElementById(id);
    if (el('heroCta'))   el('heroCta').textContent   = isEn ? 'View Works →' : '작품 보기 →';
    if (el('labelName')) el('labelName').textContent = isEn ? 'Name' : '이름 / Name';
    if (el('labelEmail'))el('labelEmail').textContent= isEn ? 'Email' : '이메일 / Email';
    if (el('labelMsg'))  el('labelMsg').textContent  = isEn ? 'Message' : '메시지 / Message';
    if (el('inputMsg'))  el('inputMsg').placeholder  = isEn ? 'Please enter your message.' : '문의 내용을 입력해 주세요.';
    if (el('inputName')) el('inputName').placeholder = isEn ? 'Your name' : '성함을 입력해 주세요.';

    renderArtist();
    renderCV();
    renderExhibitions();
  }

  /* ── 작가 정보 ── */
  function renderArtist() {
    const a = C.artist || {};
    document.getElementById('navName').textContent    = lang === 'en' ? (a.nameEn||a.nameKo||'') : (a.nameKo||a.nameEn||'');
    document.getElementById('heroLabel').textContent  = a.label || '';
    document.getElementById('heroNameKo').textContent = a.nameKo || '';
    document.getElementById('heroNameEn').textContent = a.nameEn || '';
    document.getElementById('heroBio').innerHTML     = nl2br(t(a, 'bio'));
    document.getElementById('contactText').innerHTML  = nl2br(t(a, 'contactText'));
    document.title = (a.nameEn || a.nameKo || 'Artist') + ' · ' + (a.nameEn || '');

    const links = document.getElementById('contactLinks');
    links.innerHTML = '';
    if (a.email) {
      links.innerHTML += `<a class="contact-link" href="mailto:${esc(a.email)}">
        <span class="contact-link-label">Email</span>
        <span class="contact-link-val">${esc(a.email)}</span></a>`;
    }
    if (a.instagram) {
      links.innerHTML += `<a class="contact-link" href="${esc(a.instagramUrl||'#')}" target="_blank" rel="noopener">
        <span class="contact-link-label">Instagram</span>
        <span class="contact-link-val">${esc(a.instagram)}</span></a>`;
    }
    document.getElementById('footerName').textContent = [a.nameKo, a.nameEn].filter(Boolean).join(' · ');
    document.getElementById('footerCopy').textContent = t(a, 'footer');
  }

  /* ── Hero 배경 ── */
  function renderHeroBg() {
    const a = C.artist || {};
    // 1) artist.heroBgImage 우선
    if (a.heroBgImage) {
      document.documentElement.style.setProperty('--hero-bg-image', `url("${a.heroBgImage}")`);
      return;
    }
    // 2) 없으면 최신 작품 첫 이미지
    const works = C.works || [];
    if (!works.length) return;
    let recent = works[0];
    works.forEach(w => { if (parseInt(w.year||0,10) > parseInt(recent.year||0,10)) recent = w; });
    const imgs = recent ? (recent.images && recent.images.length ? recent.images : (recent.image ? [recent.image] : [])) : [];
    if (imgs.length > 0) {
      document.documentElement.style.setProperty('--hero-bg-image', `url("${imgs[0]}")`);
    }
  }

  /* ── CV ── */
  function renderCV() {
    const box = document.getElementById('cvContainer');
    box.innerHTML = '';
    (C.cv || []).forEach(group => {
      const entries = (group.entries || []).map(e => `
        <div class="cv-entry">
          <span class="cv-year">${esc(e.year)}</span>
          <div class="cv-content">
            <div class="cv-title">${esc(t(e,'title'))}</div>
            ${t(e,'detail') ? `<div class="cv-detail">${esc(t(e,'detail'))}</div>` : ''}
          </div>
        </div>`).join('');
      box.innerHTML += `
        <div class="cv-grid">
          <div class="cv-category">${esc(group.category)}</div>
          <div class="cv-entries">${entries}</div>
        </div>`;
    });
  }

  /* ── Works ── */
  /* 매체 표시 이름 */
  const CAT_LABEL = {
    painting: 'Painting', installation: 'Installation', collage: 'Collage', photography: 'Photography', community: 'Community · Public Art',
    video: 'Video', photography: 'Photography',
    performance: 'Performance', printmaking: 'Printmaking', sculpture: 'Sculpture'
  };
  function catLabel(c) { return CAT_LABEL[c] || (c ? c.charAt(0).toUpperCase()+c.slice(1) : 'Other'); }

  let _activeFilter = 'all';

  function renderWorks() {
    const grid = document.getElementById('galleryGrid');
    const filterBar = document.getElementById('galleryFilter');
    grid.innerHTML = '';

    const works = [...(C.works || [])].sort((a, b) => {
      const ya = parseInt(String(a.year || '0').replace(/[^0-9]/g, '')) || 0;
      const yb = parseInt(String(b.year || '0').replace(/[^0-9]/g, '')) || 0;
      return yb - ya;
    });
    if (!works.length) { grid.innerHTML = '<p class="gallery-empty">No works registered.</p>'; return; }

    // 고정 메뉴 4개: Installation / Video / Drawing / Painting
    const MENU = [
      { key: 'all',          label: 'All' },
      { key: 'installation', label: 'Installation' },
      { key: 'video',        label: 'Video' },
      { key: 'photography',  label: 'Photography' },
      { key: 'community',    label: 'Community · Public Art' },
      { key: 'painting',     label: 'Painting' },
      { key: 'collage',      label: 'Collage' },
    ];
    filterBar.innerHTML = '';
    MENU.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (_activeFilter === m.key ? ' active' : '');
      btn.dataset.filter = m.key;
      btn.textContent = m.label;
      filterBar.appendChild(btn);
    });
    wireFilter();

    // 카테고리 표시 순서 (그 외는 뒤로)
    const CAT_ORDER = ['installation','video','collage','photography','community','painting'];
    function catRank(c){ const i = CAT_ORDER.indexOf(c); return i === -1 ? CAT_ORDER.length : i; }

    function buildItem(w, i) {
      const item = document.createElement('div');
      const thumbRaw = getThumb(w);
      const thumbSrc = thumbRaw ? (isYT(thumbRaw) ? ytThumb(thumbRaw) : thumbRaw) : '';
      const isYTThumb = thumbRaw && isYT(thumbRaw);
      item.className = 'gallery-item' + (thumbSrc ? '' : ' ph-' + ((i % 6) + 1));
      item.dataset.cat = w.category || '';
      const yearLine = [w.year, cap(w.category), w.desc].filter(Boolean).join(' · ');
      item.innerHTML =
        (thumbSrc ? `<img src="${esc(thumbSrc)}" alt="${esc(w.title)}" loading="lazy">` : '') +
        (isYTThumb ? `<div class="yt-play-icon">▶</div>` : '') +
        `<div class="gallery-overlay">
           <span class="g-title">${esc(w.title)}</span>
           <span class="g-year">${esc(yearLine)}</span>
         </div>`;
      item.addEventListener('click', () => openModal(w));
      return item;
    }

    // 매체별로 묶어서 섹션 렌더 (전체면 모든 그룹, 필터 시 해당 그룹만)
    const groups = {};
    works.forEach(w => {
      const c = w.category || 'other';
      (groups[c] = groups[c] || []).push(w);
    });
    const cats = Object.keys(groups).sort((a, b) => {
      const r = catRank(a) - catRank(b);
      return r !== 0 ? r : a.localeCompare(b);
    });

    let idx = 0;
    cats.forEach(c => {
      if (_activeFilter !== 'all' && c !== _activeFilter) return;
      const sec = document.createElement('div');
      sec.className = 'gallery-group';
      const h = document.createElement('h3');
      h.className = 'gallery-group-h';
      h.innerHTML = `${esc(catLabel(c))}<span class="g-count">${groups[c].length}</span>`;
      const inner = document.createElement('div');
      inner.className = 'gallery-grid-inner';
      groups[c].forEach(w => { inner.appendChild(buildItem(w, idx++)); });
      sec.appendChild(h);
      sec.appendChild(inner);
      grid.appendChild(sec);
    });
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  /* ── Exhibitions ── */
  const STATUS_LABEL = {
    ko: { current:'진행 중', upcoming:'예정', past:'종료' },
    en: { current:'Current', upcoming:'Upcoming', past:'Past' }
  };
  function renderExhibitions() {
    const list = document.getElementById('exhibitionList');
    list.innerHTML = '';
    (C.exhibitions || []).forEach(ex => {
      const st  = ex.status || 'past';
      const lbl = (STATUS_LABEL[lang] || STATUS_LABEL.ko)[st] || st;
      list.innerHTML += `
        <div class="exhibition-item">
          <div class="ex-date">${nl2br(ex.date)}</div>
          <div class="ex-info">
            <div class="ex-title">${esc(t(ex,'title'))}</div>
            <div class="ex-venue">${esc(t(ex,'venue'))}</div>
            ${ex.location ? `<div class="ex-location">${esc(ex.location)}</div>` : ''}
          </div>
          <span class="ex-badge ${esc(st)}">${esc(lbl)}</span>
        </div>`;
    });
  }

  /* ── Modal ── */
  const modal = document.getElementById('modal');
  let _modalWork = null;
  let _modalIdx = 0;

  /* ── YouTube 유틸 ── */
  function ytId(url) {
    if (!url || !url.includes('youtu')) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function isYT(src) { return !!ytId(src); }
  function ytThumb(src) { return `https://img.youtube.com/vi/${ytId(src)}/hqdefault.jpg`; }
  function ytEmbed(src) { return `https://www.youtube.com/embed/${ytId(src)}?autoplay=1&rel=0`; }

  function getImages(w) {
    // 모달용: full 이미지 우선
    if (w.images_full && w.images_full.length) return w.images_full;
    if (w.images && w.images.length) return w.images;
    if (w.image) return [w.image];
    return [];
  }
  function getThumb(w) {
    // 갤러리 썸네일용: thumb 우선
    const src = (w.images_thumb && w.images_thumb[0])
             || (w.images && w.images[0])
             || w.image || '';
    return src;
  }

  function showModalImage(w, idx) {
    _modalWork = w;
    _modalIdx = idx;
    const imgs = getImages(w);
    const content = document.getElementById('modalContent');
    const dots = document.getElementById('modalDots');
    const prev = document.getElementById('modalPrev');
    const next = document.getElementById('modalNext');

    // 이미지 or 유튜브 표시
    if (imgs.length > 0 && imgs[idx]) {
      const src = imgs[idx];
      if (isYT(src)) {
        content.innerHTML = `<div class="modal-video-wrap"><iframe src="${ytEmbed(src)}" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
      } else {
        content.innerHTML = `<img class="modal-img" src="${esc(src)}" alt="${esc(w.title)}">`;
      }
    } else {
      content.innerHTML = `<div class="modal-ph">IMAGE</div>`;
    }

    // 화살표
    prev.classList.toggle('hidden', imgs.length <= 1 || idx === 0);
    next.classList.toggle('hidden', imgs.length <= 1 || idx >= imgs.length - 1);

    // 닷 인디케이터
    dots.innerHTML = '';
    if (imgs.length > 1) {
      imgs.forEach((_, i) => {
        const d = document.createElement('span');
        d.className = 'modal-dot' + (i === idx ? ' active' : '');
        d.onclick = () => showModalImage(w, i);
        dots.appendChild(d);
      });
    }

    // 캡션
    let cap = [w.title, w.year].filter(Boolean).join(', ');
    if (w.desc) cap += '  ·  ' + w.desc;
    if (imgs.length > 1) cap += `  (${idx+1}/${imgs.length})`;
    document.getElementById('modalCaption').textContent = cap;
  }

  function openModal(w) {
    showModalImage(w, 0);
    modal.classList.add('open');
  }

  document.getElementById('modalPrev').addEventListener('click', (e) => {
    e.stopPropagation();
    if (_modalWork && _modalIdx > 0) showModalImage(_modalWork, _modalIdx - 1);
  });
  document.getElementById('modalNext').addEventListener('click', (e) => {
    e.stopPropagation();
    if (_modalWork) {
      const imgs = getImages(_modalWork);
      if (_modalIdx < imgs.length - 1) showModalImage(_modalWork, _modalIdx + 1);
    }
  });
  function closeModal() {
    modal.classList.remove('open');
    // iframe autoplay 정지
    const iframe = modal.querySelector('iframe');
    if (iframe) iframe.src = iframe.src;
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft' && _modalWork && _modalIdx > 0) showModalImage(_modalWork, _modalIdx - 1);
    if (e.key === 'ArrowRight' && _modalWork) {
      const imgs = getImages(_modalWork);
      if (_modalIdx < imgs.length - 1) showModalImage(_modalWork, _modalIdx + 1);
    }
  });

  /* ── Gallery Filter ── */
  function wireFilter() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        _activeFilter = btn.dataset.filter;
        renderWorks();
      });
    });
  }

  /* ── Contact Form ── */
  function handleSubmit(e) {
    e.preventDefault();
    const btn = e.target.querySelector('.btn-submit');
    btn.textContent = 'Sent ✓'; btn.style.background = '#555';
    setTimeout(() => { btn.textContent = 'Send →'; btn.style.background = ''; e.target.reset(); }, 2500);
  }

  /* ── Nav active scroll ── */
  function wireScroll() {
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-links a');
    const sideLinks = document.querySelectorAll('.side-nav a');
    window.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(s => { if (window.scrollY >= s.offsetTop - 80) current = s.id; });
      navLinks.forEach(a => { a.style.color = a.getAttribute('href') === '#' + current ? '#111' : ''; });
      sideLinks.forEach(a => {
        if (a.getAttribute('href') === '#' + current) a.classList.add('active');
        else a.classList.remove('active');
      });
    });
  }

  /* ── Init ── */
  renderArtist();
  renderHeroBg();
  renderCV();
  renderWorks();
  renderExhibitions();
  wireFilter();
  wireScroll();
</script>
</body>
</html>
